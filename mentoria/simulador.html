.branch { font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); padding: 1px 7px; border-radius: 4px; }
.arvore { font-size: 12.5px; font-family: var(--font-mono); }
.arvore details { margin-left: 0; }
.arvore details details, .arvore details > .f { margin-left: 13px; }
.arvore summary { cursor: pointer; color: var(--fg-2); padding: 1px 0; list-style: none; display: flex; gap: 5px; align-items: center; }
.arvore summary::-webkit-details-marker { display: none; }
.arvore summary::before { content: "▸"; color: var(--fg-3); font-size: 10px; width: 9px; }
.arvore details[open] > summary::before { content: "▾"; }
.arvore .f { display: flex; align-items: center; gap: 6px; width: calc(100% - 13px); border: 0; background: none; padding: 1px 4px; border-radius: 4px; cursor: pointer; text-align: left; color: var(--fg-2); font-family: var(--font-mono); font-size: 12.5px; }
.arvore .f:hover { background: var(--bg-3); }
.arvore .f .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arvore .f.novo .nm { color: var(--ok); font-weight: 600; }
.arvore .f.alterado .nm { color: var(--warn); font-weight: 600; }
.arvore .f .pt { margin-left: auto; font-size: 10px; flex: none; }
.arvore .f.novo .pt::after { content: "novo"; color: var(--ok); }
.arvore .f.alterado .pt::after { content: "alterado"; color: var(--warn); }
.arvore .f.removido { text-decoration: line-through; color: var(--err); }
.arvore .f.removido .pt::after { content: "revertido"; color: var(--err); }
.vazio { font-size: 12.5px; color: var(--fg-3); font-style: italic; }
.feats { display: flex; flex-direction: column; gap: 6px; }
.feat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; }
.feat.mudou { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
.feat .l1 { display: flex; gap: 6px; align-items: baseline; justify-content: space-between; }
.feat .id { font-family: var(--font-mono); font-weight: 600; color: var(--fg); font-size: 12px; }
.feat .nm2 { color: var(--fg-2); }
.feat .est { font-size: 12px; white-space: nowrap; }
.gates { display: flex; gap: 3px; margin-top: 6px; }
.gates span { flex: 1; text-align: center; font-size: 10px; font-family: var(--font-mono); border-radius: 3px; padding: 1px 0; background: var(--bg-3); color: var(--fg-3); }
.gates span.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.gates span.alerta { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.feat.removida { opacity: 0.55; }
.feat.removida .id { text-decoration: line-through; }
.aims { display: flex; flex-direction: column; gap: 6px; }
.aim { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; }
.aim.mudou { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
.aim .l1 { display: flex; justify-content: space-between; gap: 6px; }
.aim .id { font-family: var(--font-mono); font-weight: 600; color: var(--fg); font-size: 12px; }
.trilha { display: flex; gap: 3px; margin-top: 6px; }
.trilha i { flex: 1; height: 5px; border-radius: 3px; background: var(--bg-3); }
.trilha i.ok { background: var(--ok); }
.aim.revertida { opacity: 0.55; }
.aim.revertida .id { text-decoration: line-through; }
.commits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.commits li { font-family: var(--font-mono); color: var(--fg-2); overflow-wrap: anywhere; line-height: 1.4; }
.commits li.novo { color: var(--ok); }
.commits li.rev { color: var(--err); }

/* ── Controles ───────────────────────────────────── */
.ctl {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  min-height: 64px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; background: var(--bg); border-top: 1px solid var(--line);
}
.ctl .prog { flex: 1; min-width: 60px; display: flex; flex-direction: column; gap: 4px; }
.ctl .prog small { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra { height: 4px; border-radius: 2px; background: var(--bg-3); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--fg); }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.prim { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; max-width: min(520px, 62vw); overflow: hidden; text-overflow: ellipsis; }
.btn.prim .ico { margin-right: 6px; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--fg-3); white-space: nowrap; }

/* ── Sobreposições ───────────────────────────────── */
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(0, 25, 48, 0.45); display: grid; place-items: center; padding: 16px; }
.ov-caixa { background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); width: min(1180px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; overflow: hidden; }
.ov-caixa.estreita { width: min(780px, 100%); }
#ov-mapa .ov-caixa { width: 100%; }
.ov-cab { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ov-cab h2 { font-size: 18px; }
.ov-cab .x { margin-left: auto; }
.ov-corpo { min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.ov-corpo > * { flex-shrink: 0; }
.ov.suspensa { place-items: stretch end; padding: 12px; }
.ov.suspensa .ov-caixa { width: min(420px, 100%); max-height: calc(100dvh - 24px); }
.ov.suspensa .inst { display: block; }
.mapa-arquivos table { table-layout: fixed; overflow-wrap: anywhere; }
.mapa-arquivos code { white-space: normal; }
.mapa-arquivos td:first-child { width: 36%; }
.abas { display: flex; gap: 4px; }
.abas button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.abas button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mapa { overflow-x: auto; }
.mapa table { min-width: 1080px; table-layout: fixed; }
.mapa th, .mapa td { border: 1px solid var(--line); padding: 6px; }
.mapa th:first-child { width: 150px; }
.mapa td.atual { background: var(--warn-soft); }
.mapa .sc { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 3px 6px; margin: 0 0 4px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; line-height: 1.35; color: var(--fg); overflow-wrap: anywhere; }
.mapa .sc:hover { border-color: var(--fg-3); }
.mapa .sc .r { font-family: var(--font-text); font-size: 10.5px; color: var(--fg-3); display: block; }
.mapa .faixa { font-size: 12.5px; font-weight: 600; color: var(--fg); }
.mapa .faixa small { display: block; font-weight: 400; color: var(--fg-3); font-size: 11px; }
.lnk { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; text-decoration: underline; font-size: inherit; font-family: inherit; }
.mk-err { color: var(--err); font-weight: 700; } .mk-ok { color: var(--ok); font-weight: 700; } .mk-warn { color: var(--warn); font-weight: 700; }
.arq-desc { font-size: 15px; color: var(--fg); }
.arq-meta { font-size: 12.5px; color: var(--fg-3); }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .rot { position: fixed; z-index: 30; left: 0; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); bottom: var(--ctl-h); width: min(320px, 88vw); max-height: none; background: var(--bg); box-shadow: var(--shadow); transform: translateX(-105%); transition: transform 0.2s; visibility: hidden; }
  .rot.aberto { transform: none; }
  .rot.aberto { visibility: visible; }
  .rot-resizer { display: none; }
  .so-estreito { display: inline-flex; }
  .stage { padding: 16px 16px calc(var(--ctl-h) + 40px); }
  .marca span, .chk { display: none; }
  .btn.prim { max-width: 60vw; }
}
@media (max-width: 480px) {
  .top { gap: 8px; padding: 8px; }
  .marca { gap: 6px; }
  .marca-docqui { width: 90px; }
  .marca-caixa { width: 56px; }
  .seg-rot { display: none; }
  .ov { padding: 8px; }
  .ov-caixa { max-height: calc(100dvh - 16px); }
  .ov-cab { padding: 10px; }
  .abas { order: 1; width: 100%; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  .novo-bloco { animation: none; }
  .cursor { animation: none; }
  .rot { transition: none; }
}
</style>
</head>

<!-- ════════════════════════════════════════════════════════════════════════
     DADOS. Texto simples, lido pelo motor no fim da página.
     Arquivos e validadores: um por linha, campos separados por " :: ".
     Passos: "=== id" abre o passo; linhas "chave: valor" são o cabeçalho
     (chave@perfil vale só naquele perfil); "--- tipo[@perfil] arg | arg"
     abre um bloco. Tipos: intro, nota <tipo>, chat, ticket, file, term, fix,
     menu, fx. Em file, "» " no início marca a linha em destaque. Em fix,
     "@ caminho" troca de arquivo e "+ "/"- " são linhas do diff. Em term,
     "$ " é comando; o resultado sai das próprias linhas (✗ ❌ reprova,
     ⚠ ! avisa). fx guarda o estado: feat, aim, branch, commit, merge e
     "+ caminho" / "~ caminho" / "- caminho" para arquivos que nenhum
     bloco file/fix mostra.
     Roteiro revisado para Docqui Caixa 7.2.0, nos dois perfis. Recapturados
     numa instância criada pelo init-instance, com os arquivos que os passos
     mostram: o bootstrap; os gates de gravação dos N1, N2, DM e N3 (com o F9
     de regras × cenários e, no completo, o F10 do contrato da API); o
     monta-contexto do 3B, do 5B e do 5A; o valida-artefatos-previstos com o
     caminho de volta, num loja-api de teste; o derivador da AIMM do segundo
     ticket; e o delta-n3 do 5A em alteração. As saídas de scripts e entradas

preflight-spec.mjs :: sessão · F1 :: Panorama do que já existe e das reservas do N2, inclusive N3 ainda não escrito. Mostra o próximo número sem preencher lacunas; informativo, sempre sai 0.

validate-doc.mjs :: ao gravar · F2 · CI :: Estrutura de N0 a N3 e do data-model: título, subtítulo de nível, seções obrigatórias, a sigla do MASTER, o repositório da implementação.
valida-semantica-funcionalidade.mjs :: ao gravar · F2 :: O N3 é mesmo uma funcionalidade? FD-1 a FD-9 reprovam (verbo, atomicidade, regra invariante, descrição da entrega); FD-10 a FD-12 e [MSG] avisam.
valida-citacoes-dicionario.mjs :: ao gravar · F6 :: Toda citação `→ ver <X>-DICTIONARY: alvo` tem entrada no dicionário.
valida-fluxo-principal.mjs :: ao gravar · F7 :: Toda funcionalidade da tabela do N2 tem nó com o nome exato no `## Fluxo Principal`.
audit-trace-links.mjs :: ao gravar · F3 · CI :: O elo ticket ↔ funcionalidade concorda nos três lugares (`## Origem` do N3, `## Funcionalidades` da AIMM, INDEX), inclusive o Status.
valida-enumeracao-contagem.mjs :: ao gravar · F8 :: A memória de cálculo de cada processo elementar é um bloco JSON de nomes, do tamanho do ALR e do DER da tabela.
valida-regras-cenarios.mjs :: ao gravar · F9 · CI :: Toda regra de negócio do N3 tem ID `RN-NN`, único na funcionalidade, e ao menos um cenário com a tag `@RN-NN` dela. Tag sem regra reprova; N3 sem ID nenhum (anterior à 6.3.0) e regra só com cenário técnico avisam.
valida-contrato-api.mjs :: ao gravar · F10 · CI :: Num N3 com `## API`: E1 endpoints, E2 e E3 códigos de erro × Mapeamento, E4 código fora do ERROR-DICTIONARY, E5 Label PO da tabela da API fora de `## Campos`, E6 HTTP diferente do dicionário. Sem `## API`, não há o que conferir.
monta-contexto.mjs :: sessão · 3B · 5B · 5A :: O pacote de contexto da funcionalidade (ou, com `--agrupamento`, do Agrupamento Funcional): o N3 e, dos globais, só o que ele usa. O que é citado e não existe abre o pacote como ❓; com `--base`, traz o delta.
generate-impact-draft.mjs :: AIMM · passo 5 :: Deriva o changeset dos elos das funcionalidades do ticket e o grava na AIMM. Não valida.
validate-impact.mjs :: AIMM · CI :: Estrutura da AIMM, invariantes C1 a C3, portões por estado (aval, fechamento, estado final das funcionalidades) e a AIMM da sprint conferida com as dos tickets.
gates.py :: esteira · CI :: Máquina de estados dos checkpoints: ordem, um gate por PR (no perfil requisitos, CP1 e CP2 podem ir juntos), quem e quando, estado derivado, artefato da etapa. Regenera o espelho no INDEX.
valida-contagem-consolidada.mjs :: contagem :: O CONTAGEM-PF espelha a contagem dos N3: o PF, a pendência e o papel de cada processo elementar.
delta-n3.mjs :: alteração :: O que mudou em cada N3 da AIMM entre a main e a branch, por seção. É a entrada do SDD em modo alteração.
valida-artefatos-previstos.mjs :: CI do código · CP4 :: O código cita o ID de cada funcionalidade implementada e, no caminho de volta, toda regra `RN-NN` aparece como `<ID>/RN-NN` num teste e todo código de `error_codes` aparece no código. Com `--repo nome=dir`, confere somente aquele serviço; `--repos-dir` confere os repositórios clonados lado a lado.
gera-indice-repos.mjs :: publicação · CI :: Deriva a seção Funcionalidades por repositório do `## Implementação` dos N3; `--check` reprova quando o índice está defasado.
valida-commits-ticket.mjs :: branch de entrega · CI :: Cada commit que toca a spec cita uma chave só.
reverte-ticket.mjs :: branch de entrega :: Tira da branch da sprint o ticket que não foi entregue, revertendo os commits que citam a chave.
valida-entrega.mjs :: branch de entrega · CI :: O portão do merge na main: AIMMs concluídas, funcionalidades no estado final da esteira e a branch alterando só o que os tickets entregues declaram.
monta-site-preview.mjs :: CI · Pages :: Publica snapshots de commits: main e branches de entrega, com seletor, base do PR, Ver alterações e comparação por palavra no próprio artefato. Sem PR, explicita a referência à main.

init-instance.mjs :: engine → instância :: Cria uma instância em branco, já sincronizada, com o Perfil e a Cadência no MASTER.
check-approval-trailers.mjs :: CI :: Todo commit que entra na main tocando `modules/` ou `global/` traz o trailer de aprovação.
verifica-texto-corrido.mjs :: sob demanda :: Parágrafo de prosa numa linha só, sem quebra no meio.

=== inicio
cap: A
fase: prep
titulo: Como usar este simulador
niveis: N0 N1 N2 N3
quem: você
--- intro
O **Docqui Caixa** especifica software em quatro níveis, da visão de produto (N0) à funcionalidade descrita campo a campo (N3). Prompts conduzem a escrita; scripts conferem o resultado. Este simulador acompanha a equipe da **Loja Acme** do repositório vazio até a entrega de uma sprint com três histórias.

Em cada passo você vê quem trabalha, que opção do menu roda, o arquivo que nasce ou muda e o validador que confere. Quando um validador reprova, você lê a saída real, aplica a correção e roda de novo.
--- nota conceito
| Nível | Pergunta que responde | Arquivo |
|---|---|---|
| **N0** · Visão de Produto | Por que este software existe? | `global/N0_PRODUCT_VISION.md` |
| **N1** · Domínio | Quais são as grandes áreas do sistema? | `modules/<dominio>/README.md` |
| **N2** · Agrupamento Funcional | O que o usuário faz em cada área? | `modules/<dominio>/<agrupamento-funcional>/README.md` |
| **N3** · Funcionalidade | Como funciona, em detalhe, cada funcionalidade? | `modules/<dominio>/<agrupamento-funcional>/f-<verbo>-<entidade>.md` |
--- nota dica
O botão principal, embaixo à direita, avança: roda o próximo comando, aplica a próxima correção ou passa ao passo seguinte. As setas → e ← do teclado fazem o mesmo. **Instância**, no topo, abre o painel suspenso: clique num arquivo para ver o que ele é e o trecho mais recente. O painel começa oculto para o conteúdo ocupar a largura disponível. Arraste a divisória do roteiro para redimensioná-lo no desktop. **Mapa** mostra o processo inteiro, cada validador e cada arquivo global; em **Arquivos**, a rolagem é única para todas as seções. Para dar aula sem cliques, marque *mostrar o passo inteiro*.
--- nota dica
**GitHub · PRs**, no topo, abre a parte visual que ocorre no GitHub: comparar branches, criar PR, consultar **Conversation**, **Commits**, **Checks** e **Files changed**, pedir alterações, aprovar e confirmar o merge. Depois de simular uma correção, **Files changed** permite alternar entre o **PR completo** (base → atual) e o **commit de correção** (antes → depois), com as remoções em vermelho e as adições em verde. O botão nos checks abre diretamente essa comparação. Os checkpoints têm atalhos para suas cenas. No CP4, veja primeiro o PR de código em `loja-api` e depois o registro em `loja-doc`. No planejamento, o PR da sprint é **Draft**; na entrega, o mesmo PR é concluído. É uma simulação didática local: nenhuma operação vai para sua conta, e os cliques não alteram os arquivos nem a esteira do roteiro.
--- nota perfil
O seletor **Perfil**, no topo, troca a instância de perfil a qualquer momento. Em `completo`, a spec vai até o código: quatro checkpoints e estado final ✅ `implementado`. Em `requisitos`, a instância para no negocial e no modelo de dados: dois checkpoints e estado final 📋 `especificado`. Os passos que só existem num perfil aparecem ou somem, e os demais mudam o que precisam.
--- nota regra
**Branches e AIMMs:** história usa `historia/STRY0000000` e `analise-impacto/AIMM-STRY0000000.md`; sprint usa `sprint/SP07` e `analise-impacto/AIMM-SP07.md`. A cadência no MASTER decide a unidade de entrega. Este simulador percorre uma **sprint**: PRs de um checkpoint usam `checkpoint/STRY0013101-cp1` com destino a `sprint/SP07`, não a branch de história. Pages publica `historia/*` e `sprint/*`; no environment **github-pages**, permita as duas além da `main`. Envie a branch ao remoto com ao menos um commit próprio e aguarde o deploy.
--- nota conceito
A equipe: **Ana** (PO), **Rui** (analista de requisitos), **Bruno** (DBA), **Lia** (QA) e **Caio** (Tech Lead). O **Claude** conduz os prompts; o hook `spec-guard` e a CI rodam os validadores. O roteiro foi revisado para **Docqui Caixa 7.2.0**: usa os níveis Domínio, Agrupamento Funcional e Funcionalidade, a AIMM do ticket sem Contexto, com as Decisões pendentes e as Alterações em funcionalidades por Agrupamento Funcional, explicita `historia/*`, `sprint/*` e os PRs temporários `checkpoint/*`, além do N3 com a Superfície logo antes do Comportamento de tela e a Origem antes do Changelog, o N2 sem a coluna Prioridade, global conforme o perfil, reservas de IDs imutáveis e revisão de previews por palavra, regras `RN-NN`, cenários `@RN-NN`, contrato da API e caminho de volta até o teste. AIMM significa **Análise de Impacto de Mudança para Manutenção**; no ticket, Contexto é leitura do analista, nome da funcionalidade fica abaixo do ID e entidades não carregam PF. O selo acompanha a versão do engine; a revisão do roteiro é explícita. As capturas novas foram verificadas numa instância isolada; datas e hashes do enredo são didáticos, e trechos sem mudança mantêm a captura anterior.

=== master
cap: A
fase: prep
titulo: O MASTER: identidade, perfil e cadência
quem: Rui (analista) · Ana (PO)

# Calcular Frete
> **Nível 3** - Agrupamento Funcional: Checkout — Domínio: Vendas - `VND-CHK-01`

## Descrição

Permite que o cliente calcule o frete do pedido pelo CEP de entrega, vendo o valor antes de confirmar a compra.

No checkout, o cliente digita o CEP e aciona Calcular; o valor aparece ao lado do total.

## Regras de negócio

- **RN-01** — O frete é o valor da faixa de CEP da Tabela de Frete que contém o CEP de entrega.
» - **RN-02** — CEP fora de todas as faixas não é atendido; caso contrário, o sistema não salva e exibe mensagem. → ver FIELD-DICTIONARY: CEP

## Cenários

```gherkin
Feature: Calcular Frete

  Background:
    Given que o cliente está no checkout com itens no carrinho

  @RN-01
  Scenario: frete calculado pelo CEP
    When o cliente informa o CEP "01310-100"
    And clica em "Calcular"
    Then o sistema mostra "Frete: R$ 18,90"

  Scenario: CEP inválido
    When o cliente informa o CEP "0131"
    Then o sistema exibe abaixo do campo: "Formato inválido."
    # ← MESSAGE-DICTIONARY: BASELINE

  Scenario: CEP fora da área de entrega
    When o cliente informa o CEP "69900-000"
    And clica em "Calcular"
    Then o sistema exibe: "Ainda não entregamos neste CEP."
```

# Consultar Resumo do Pedido
> **Nível 3** - Agrupamento Funcional: Checkout — Domínio: Vendas - `VND-CHK-02`

## Descrição

Permite que o cliente consulte o resumo do pedido antes de confirmar, com o valor do frete e o prazo de entrega prometido.

`pages-prs.json` é a entrada gerada pelo workflow a partir dos PRs do próprio repositório. O PR #30 é draft e tem a base `main`: draft permite consultar o preview, não entregar a sprint. A comparação parte do ancestral comum. Se o destino fosse `sprint/SP07`, essa seria a base de revisão; sem PR aberto, a referência à `main` aparece explicitamente como fallback, não como origem comprovada.

--- nota conceito
| Endereço / controle | O que mostra |
|---|---|
| `/` | a `main`: o que já foi entregue |
| `/sprint/SP07/` | a branch da sprint: o que está em andamento |
| Seletor de branch | troca main, sprint ou história, preservando o artefato aberto |
| **Ver alterações** | diff completo por arquivo, com incluídos, alterados, excluídos, renomeados e binários |
| **Destacar alterações** | vem ligado no preview; marca as diferenças no próprio artefato Markdown |

Cada preview leva `preview.json` e `_docqui/changes.json`; a raiz leva `previews.json` para o seletor. Depois da entrega e da montagem seguinte, a branch incorporada sai do preview. As instâncias existentes precisam receber a integração do template `pages.yml`, preservando suas customizações: sincronizar scripts não muda o workflow herdado.
--- nota conceito
**Exemplo de revisão por palavra em uma célula do N2.** O ticket do prazo altera a descrição de Calcular Frete: o comparador realça só o trecho novo, sem pintar o contexto igual. A mesma regra vale para parágrafos, listas e código. Aqui os trechos destacados são representados em negrito; no Pages recebem a marcação de inclusão/remoção.

| Visão | Descrição da funcionalidade |
|---|---|
| Base do PR | valor da entrega pelo CEP |
| Preview · destaque ligado | valor **e prazo** da entrega pelo CEP |
| Preview · destaque desligado | valor e prazo da entrega pelo CEP |

Na troca de “até 5 dias úteis” por “até 3 dias úteis”, só **5** fica riscado e só **3** é destacado. Linhas ou blocos totalmente novos/removidos são marcados por inteiro. Desligar o controle restaura o conteúdo atual e preserva links e formatação. **Copiar código entrega só a versão atual**, nunca o texto removido. Na `main` não há essas marcações; erro ao carregar a comparação é informado na barra, não tratado como “nenhuma alteração”.

const GATED = new Set(['term', 'fix']);

/* ── Leitura dos dados ──────────────────────────────────────────────── */
const textoDe = (id) => document.getElementById(id).textContent.replaceAll('{{VERSION}}', VERSAO);

const SCR = new Map(linhasDe('dados-scripts').map((l) => { const p = l.split(' :: '); return [p[0], { onde: p[1], faz: p[2] }]; }));

function parsePassos(src) {
  const passos = [];
  let cur = null;
  let blk = null;
  for (const linha of src.split('\n')) {
    if (linha.startsWith('=== ')) { cur = { id: linha.slice(4).trim(), meta: {}, blocos: [] }; passos.push(cur); blk = null; continue; }
    if (!cur) continue;
    if (linha.startsWith('--- ')) {
      const m = linha.slice(4).match(/^(\w+)(?:@(\w+))?\s*(.*)$/);
      blk = { t: m[1], perfil: m[2] || null, args: m[3] ? m[3].split(' | ').map((s) => s.trim()) : [], linhas: [] };
      cur.blocos.push(blk);
      continue;
    }
    if (!blk) { const m = linha.match(/^([\w-]+(?:@\w+)?):\s?(.*)$/); if (m) cur.meta[m[1]] = m[2].trim(); continue; }
    blk.linhas.push(linha);
  }
  for (const p of passos) for (const b of p.blocos) {
    while (b.linhas.length && !b.linhas[b.linhas.length - 1].trim()) b.linhas.pop();
    while (b.linhas.length && !b.linhas[0].trim()) b.linhas.shift();
  }
  return passos;
}
const TODOS = parsePassos(textoDe('dados-passos'));

/* ── Estado da navegação ────────────────────────────────────────────── */

/* ── Texto: escape e um markdown mínimo ─────────────────────────────── */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  const codes = [];
  let t = String(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  t = esc(t)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?=[^*\w]|$)/g, '$1<em>$2</em>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
}
function md(linhas) {
  const out = [];
  let i = 0;
  while (i < linhas.length) {
    const l = linhas[i];
    if (!l.trim()) { i++; continue; }
    if (l.trim().startsWith('|')) {
      const rows = [];
      while (i < linhas.length && linhas[i].trim().startsWith('|')) { rows.push(linhas[i].trim()); i++; }
      const cel = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const cab = cel(rows[0]);
      const corpo = rows.slice(1).filter((r) => !/^\|[\s:|-]+\|$/.test(r));
      out.push('<div class="tab-wrap"><table><thead><tr>' + cab.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        corpo.map((r) => '<tr>' + cel(r).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^- /.test(l.trim())) {
      const itens = [];
      while (i < linhas.length && /^- /.test(linhas[i].trim())) { itens.push(linhas[i].trim().slice(2)); i++; }
      out.push('<ul>' + itens.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>');
      continue;
    }
    const par = [];
    while (i < linhas.length && linhas[i].trim() && !linhas[i].trim().startsWith('|') && !/^- /.test(linhas[i].trim())) { par.push(linhas[i].trim()); i++; }
    out.push('<p>' + inline(par.join(' ')) + '</p>');
  }
  return out.join('');
}

/* ── Realce do conteúdo dos arquivos ────────────────────────────────── */
function realca(l, emFm) {
  const e = esc(l);
  if (emFm) return '<span class="k-fm">' + e + '</span>';
  if (/^\s*<!--/.test(l) || /^\s*#\s*[←─]/.test(l)) return '<span class="k-c">' + e + '</span>';
  if (/^#{1,4} /.test(l)) return '<span class="k-h">' + e + '</span>';
  if (/^\s*(Feature|Background|Scenario|Given|When|Then|And|But):?\b/.test(l)) return e.replace(/^(\s*)(Feature:|Background:|Scenario:|Given|When|Then|And|But)/, '$1<span class="k-g">$2</span>');
  if (/→ ver /.test(l)) return e.replace(/(→ ver [^|]*)/, '<span class="k-r">$1</span>');
  if (/^\s*\|/.test(l)) return e.replace(/\|/g, '<span class="k-p">|</span>');
  return e;
}
function codigoHTML(linhas, modo) {
  let emFm = false;
  // Front-matter só no topo do arquivo (depois do carimbo, se houver): um `---` no meio é régua.
  const limpa = (l) => l.replace(/^» ?/, '').trim();
  let ini = -1;
  for (let i = 0; i < linhas.length && modo !== 'diff'; i++) {
    const t = limpa(linhas[i]);
    if (t === '---') { ini = i; break; }
    if (t && !t.startsWith('<!--')) break;
  }
  return linhas.map((raw, i) => {
    let l = raw;
    let cls = '';
    if (modo === 'diff') {
      if (l.startsWith('@ ')) return '<span class="l arq">' + esc(l.slice(2)) + '</span>';
      if (l.startsWith('+ ') || l === '+') { cls = 'add'; l = l.slice(2); }
      else if (l.startsWith('- ') || l === '-') { cls = 'del'; l = l.slice(2); }
      else { cls = 'ctx'; l = l.startsWith('  ') ? l.slice(2) : l; }
    } else if (l.startsWith('» ') || l === '»') { cls = 'hl'; l = l.slice(2); }
    if (i === ini) { emFm = true; return '<span class="l ' + cls + '"><span class="k-fm">---</span></span>'; }
    if (emFm && l.trim() === '---') { emFm = false; return '<span class="l ' + cls + '"><span class="k-fm">---</span></span>'; }
    return '<span class="l ' + cls + '">' + (realca(l, emFm) || ' ') + '</span>';
  }).join('');
}

/* ── Terminal: segmentos por comando e resultado ────────────────────── */
function segmentos(b) {
  const segs = [];
  let cur = null;
  for (const l of b.linhas) {
    if (l.startsWith('$ ')) { cur = { cmd: l.slice(2), out: [] }; segs.push(cur); continue; }
    if (!cur) { cur = { cmd: '', out: [] }; segs.push(cur); }
    cur.out.push(l);
  }
  for (const s of segs) {
    const m = s.cmd.match(/scripts\/([\w./-]+?\.(?:mjs|py|sh))|^(git)\b/);
    s.script = m ? (m[1] ? m[1].replace(/^.*\//, '') : 'git') : '';
    s.res = s.out.some((o) => /^\s*(✗|❌)/.test(o) || /^\s*- .*\[FD-\d+\]/.test(o)) ? 'erro'
      : s.out.some((o) => /^\s*(⚠|!|⚫)/.test(o) || /aviso\(s\)/.test(o)) ? 'aviso' : 'ok';
  }
  return segs;
}
const resultado = (segs) => segs.some((s) => s.res === 'erro') ? 'erro' : segs.some((s) => s.res === 'aviso') ? 'aviso' : 'ok';
const RES_TXT = { ok: '✓ passou', erro: '✗ reprovou', aviso: '✓ passou, com avisos' };
function corLinha(o) {
  if (/^\s*(✗|❌|- .*\[FD-)/.test(o)) return 't-err';
  if (/^\s*(✓|✔)/.test(o)) return 't-ok';
  if (/^\s*(⚠|!|🔴|🟠|🟡|⚫)/.test(o)) return 't-warn';
  if (/^\s*(→|\(|Regra:|Próximos|A main|Cada commit|Corrija|Acerte|Nenhum|  \d\.)/.test(o)) return 't-dim';
  return '';
}

/* ── Estado da instância: reproduz os passos até o atual ────────────── */
function estadoAte(lista, idx) {
  const E = { arq: new Map(), mud: new Map(), corpo: new Map(), feats: new Map(), aims: new Map(), branch: '—', commits: [], fm: new Set(), am: new Set() };
  lista.slice(0, idx + 1).forEach((p, i) => {
    const atual = i === idx;
    const marca = (path, op) => {
      if (op === '-') { if (E.arq.has(path)) E.arq.get(path).rem = true; }
      else if (!E.arq.has(path) || E.arq.get(path).rem) E.arq.set(path, { desde: p.id });
      if (atual) E.mud.set(path, op === '-' ? 'removido' : (op === '+' ? 'novo' : 'alterado'));
    };
    for (const b of p.blocos.filter(vale)) {
      if (b.t === 'file') {
        const path = b.args[0];
        marca(path, E.arq.has(path) && !E.arq.get(path).rem ? '~' : '+');
        E.corpo.set(path, { linhas: b.linhas, passo: p, rot: b.args[1] || '' });
      } else if (b.t === 'fix') {
        for (const [path, diff] of secoesDiff(b.linhas)) {
          if (path.startsWith('(')) continue;
          marca(path, E.arq.has(path) && !E.arq.get(path).rem ? '~' : '+');
          const c = E.corpo.get(path);
          if (!c) continue;
          const novo = aplicaDiff(c.linhas, diff);
          if (novo) E.corpo.set(path, { ...c, linhas: novo, corrigido: p, defasado: null });
          else E.corpo.set(path, { ...c, defasado: p });
        }
      } else if (b.t === 'fx') {
        for (const raw of b.linhas) {
          const l = raw.trim();
          let m;
          if ((m = l.match(/^([+~-])\s+(.+)$/))) marca(m[2].trim(), m[1]);
          else if ((m = l.match(/^feat\s+(\S+)\s+(\S+)(?:\s+\|\s+(.+))?$/))) {
            const f = E.feats.get(m[1]) || { id: m[1], nome: '' };
            f.estado = m[2]; if (m[3]) f.nome = m[3];
            E.feats.set(m[1], f); if (atual) E.fm.add(m[1]);
          } else if ((m = l.match(/^aim\s+(\S+)\s+(\S+)$/))) {
            const a = E.aims.get(m[1]) || { id: m[1] };
            a.estado = m[2]; E.aims.set(m[1], a); if (atual) E.am.add(m[1]);
          } else if ((m = l.match(/^branch\s+(\S+)$/))) E.branch = m[1];
          else if ((m = l.match(/^commit\s+(.+)$/))) E.commits.push({ msg: m[1], novo: atual, rev: /^Revert/.test(m[1]) });
        }
      }
    }
    if (!atual) for (const v of E.arq.values()) if (v.rem) v.oculto = true;
  });
  return E;
}

/* Aplica o diff de uma correção ao último trecho mostrado do arquivo, para o visualizador
   abrir a versão corrigida. "…" no diff vale por qualquer texto; o que ele cobriu na linha
   removida volta na linha acrescentada. Se uma linha não casa, devolve null. */
function secoesDiff(linhas) {
  const out = [];
  let cur = null;
  for (const l of linhas) {
    if (l.startsWith('@ ')) { cur = [l.slice(2).trim(), []]; out.push(cur); continue; }
    if (cur) cur[1].push(l);
  }
  return out;
}
function aplicaDiff(linhas, diff) {
  const corpo = linhas.map((l) => l.replace(/^» ?/, ''));
  const norm = (l) => l.trim();
  const re = (l) => new RegExp('^' + l.trim().split('…').map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('(.*?)') + '$');
  // Linha acrescentada entra logo depois da linha de contexto ou da removida que a precede.
  // "(…)" no diff marca um trecho omitido: o que vem depois dela entra antes da próxima âncora.
  let pos = 0;
  let caps = [];
  let imediato = false;
  let pend = [];
  for (const d of diff) {
    let tipo;
    let txt;
    if (d.startsWith('+ ') || d === '+') { tipo = '+'; txt = d.slice(2); }
    else if (d.startsWith('- ') || d === '-') { tipo = '-'; txt = d.slice(2); }
    else { tipo = ' '; txt = d.startsWith('  ') ? d.slice(2) : d; }
    if (tipo === '+') {
      let k = 0;
      const t = txt.includes('…') && caps.length ? txt.replace(/…/g, () => caps[k++] ?? '…') : txt;
      const linha = t.trim() ? '» ' + t : '';
      if (imediato) corpo.splice(pos++, 0, linha); else pend.push(linha);
      continue;
    }
    if (!txt.trim()) continue;
    if (/^\(…/.test(txt.trim())) { imediato = false; continue; }
    const r = re(txt);
    let idx = -1;
    let m = null;
    for (let i = pos; i < corpo.length; i++) { m = norm(corpo[i]).match(r); if (m) { idx = i; break; } }
    if (idx < 0) return null;
    if (pend.length) { corpo.splice(idx, 0, ...pend); idx += pend.length; pend = []; }
    if (tipo === '-') { caps = m.slice(1); corpo.splice(idx, 1); pos = idx; } else pos = idx + 1;
    imediato = true;
  }
  if (pend.length) corpo.splice(pos, 0, ...pend);
  return corpo;
}

/* ── Renderização ───────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const stageIn = $('#stage-in');

function render() {

  renderRoteiro(lista);
  renderPalco(p, lista);

function renderRoteiro(lista) {
  let html = '';

  lista.forEach((p, i) => {
    if (p.meta.cap !== cap) { if (cap) html += '</ol></div>'; cap = p.meta.cap; html += '<div class="cap"><h3>' + esc(cap + ' · ' + CAPS[cap]) + '</h3><ol>'; }

    html += '<li class="' + (i === st.idx ? 'atual' : i < st.idx ? 'feito' : '') + '"><button data-ir="' + i + '"' + (i === st.idx ? ' aria-current="step"' : '') + '><span class="n">' + String(i + 1).padStart(2, '0') + '</span><span>' + inline(meta(p, 'titulo')) + so + '</span></button></li>';
  });

function cabecalho(p, lista) {
  const fase = meta(p, 'fase');
  const fi = FASES.findIndex((f) => f[0] === fase);
  const fases = FASES.map((f, i) => '<span class="fase ' + (i === fi ? 'on' : i < fi ? 'feita' : '') + '">' + esc(f[1]) + '</span>').join('');
  const niv = meta(p, 'niveis').split(/\s+/).filter(Boolean);
  const barras = niv.length ? '<span class="niveis-l"><span class="niveis" aria-hidden="true">' + ['N0', 'N1', 'N2', 'N3'].map((n) => '<i class="' + (niv.includes(n) ? 'on' : '') + '"></i>').join('') + '</span>' + esc(niv.join(' · ')) + '</span>' : '';
  const quem = meta(p, 'quem').split(' · ').filter(Boolean).map((q) => '<span class="pessoa">' + esc(q) + '</span>').join('');
  const prompt = meta(p, 'prompt');
  const carimbo = prompt ? '<span class="carimbo" title="opção do menu · prompt">Docqui Caixa · v' + esc(VERSAO) + ' · ' + esc(prompt) + '</span>' : '';
  const camadas = new Map();
  for (const b of blocos(p)) if (b.t === 'term') {
    const c = CAMADAS.find((x) => x[0] === b.args[1]);
    if (!c) continue;
    const scripts = segmentos(b).map((s) => s.script).filter((s) => s && s !== 'git');
    const set = camadas.get(c[1]) || new Set();
    scripts.forEach((s) => set.add(s.replace(/\.(mjs|py)$/, '')));

  const cam = [...camadas].filter(([, s]) => s.size).map(([c, s]) => '<span class="camada"><b>' + esc(c) + '</b> · ' + esc([...s].join(', ')) + '</span>').join('');

  return '<div class="cab"><div class="fases" aria-label="Fase do processo">' + fases + '</div>' +
    '<div class="eyebrow"><span>Passo ' + (st.idx + 1) + ' de ' + lista.length + '</span><span>' + esc(p.meta.cap + ' · ' + CAPS[p.meta.cap]) + '</span></div>' +
    '<h1>' + inline(meta(p, 'titulo')) + '</h1>' +
    '<div class="cab-linha"><div class="quem">' + quem + '</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' + barras + carimbo + '</div></div>' +
    (cam ? '<div class="camadas" aria-label="Validações deste passo">' + cam + '</div>' : '') + github + '</div>';
}

function renderPalco(p, lista) {
  st.token++;
  const tok = st.token;
  const bs = blocos(p);
  let html = cabecalho(p, lista);
  let g = 0;
  let animar = null;
  let ultimo = -1;
  bs.forEach((b, i) => { b._i = i; });
  for (const b of bs) {
    if (GATED.has(b.t)) {
      if (!st.tudo && g >= st.rev) break;
      if (st.novo && g === st.rev - 1) { animar = b; ultimo = b._i; }
      g++;
    }
    html += '<div class="bloco' + (ultimo === b._i || (animar && b._i > ultimo) ? ' novo-bloco' : '') + '" data-b="' + b._i + '">' + bloco(b, p) + '</div>';
  }
  stageIn.innerHTML = html;
  if (animar && animar.t === 'term') digita(stageIn.querySelector('[data-b="' + animar._i + '"] pre'), animar, tok);
  if (st.novo && ultimo >= 0) {
    const el = stageIn.querySelector('[data-b="' + ultimo + '"]');
    if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  st.novo = false;
}

function bloco(b, p) {
  switch (b.t) {
    case 'intro': return '<div class="intro">' + md(b.linhas) + '</div>';
    case 'nota': {
      const k = b.args[0] || 'conceito';
      const rot = { regra: 'Regra do método', conceito: 'Conceito', dica: 'Como usar', atencao: 'Atenção', perfil: 'Perfil ' + st.perfil }[k] || k;
      return '<div class="nota ' + esc(k) + '"><div class="rotulo">' + esc(rot) + '</div><div class="md">' + md(b.linhas) + '</div></div>';
    }
    case 'chat': {
      const msgs = [];
      for (const l of b.linhas) {
        const m = l.match(/^@([^:]+):\s?(.*)$/);
        if (m) msgs.push({ de: m[1].trim(), txt: [m[2]] }); else if (msgs.length) msgs[msgs.length - 1].txt.push(l);
      }
      return '<div class="chat">' + msgs.map((m) => {
        const tipo = m.de === 'Claude' ? 'claude' : /^hook/.test(m.de) ? 'hook' : 'gente';
        const av = tipo === 'claude' ? 'C' : tipo === 'hook' ? 'F' + (m.de.match(/F\d/) || ['F'])[0].slice(1) : m.de.slice(0, 1);
        const corpo = tipo === 'hook' ? esc(m.txt.join('\n')) : inline(m.txt.join(' ')).replace(/^(\[[^\]]+\])/, '<span class="estado-tag">$1</span>');
        return '<div class="msg ' + tipo + '"><div class="av" aria-hidden="true">' + esc(av) + '</div><div><div class="quem-m">' + esc(m.de) + '</div><div class="txt">' + corpo + '</div></div></div>';
      }).join('') + '</div>';
    }
    case 'ticket': {
      const [chave, titulo, ferr] = b.args;
      const desc = b.linhas.filter((l) => !/^CA-\d+ \|/.test(l)).join(' ');
      const cas = b.linhas.filter((l) => /^CA-\d+ \|/.test(l)).map((l) => { const i = l.indexOf(' | '); return '<li><b>' + esc(l.slice(0, i)) + '</b><span>' + inline(l.slice(i + 3)) + '</span></li>'; }).join('');
      return '<div class="ticket"><div class="ticket-cab"><span class="chave">' + esc(chave) + '</span><span>História</span><span class="ferr">' + esc(ferr || '') + '</span></div><div class="ticket-corpo"><h3>' + esc(titulo) + '</h3><div class="desc">' + inline(desc) + '</div><ul class="cas">' + cas + '</ul></div></div>';
    }
    case 'file': {
      const [path, rot] = b.args;
      const longo = b.linhas.length > 26;
      return '<div class="arquivo"><div class="arq-cab"><button class="path" data-arq="' + esc(path) + '">' + esc(path) + '</button><span class="badge ' + esc((rot || '').split(' ')[0]) + '">' + esc(rot || 'trecho') + '</span></div><pre class="codigo">' + codigoHTML(b.linhas, 'arq') + '</pre>' + (longo ? '<button class="ver-tudo" data-expande>ver o trecho inteiro</button>' : '') + '</div>';
    }
    case 'term': {
      const segs = segmentos(b);
      const res = resultado(segs);
      const c = CAMADAS.find((x) => x[0] === b.args[1]);
      return '<div class="term"><div class="term-cab"><span class="via">' + esc(b.args[0] || '') + '</span>' + (c ? '<span>· ' + esc(c[1]) + '</span>' : '') + '<span class="res ' + res + '">' + RES_TXT[res] + '</span></div><pre>' + termHTML(segs) + '</pre></div>';
    }
    case 'fix': {
      const txt = [];
      const diff = [];
      let emDiff = false;
      for (const l of b.linhas) { if (l.startsWith('@ ')) emDiff = true; (emDiff ? diff : txt).push(l); }
      return '<div class="fix"><div class="fix-cab">✎ ' + inline(b.args[0] || 'Correção') + '</div>' + (txt.length ? '<div class="fix-txt md">' + md(txt) + '</div>' : '') + (diff.length ? '<pre class="codigo">' + codigoHTML(diff, 'diff') + '</pre>' : '') + '</div>';
    }
    case 'menu': return menuHTML();
    default: return '';
  }
}

function termHTML(segs) {
  return segs.map((s) => (s.cmd ? '<span class="t-cmd">' + esc(s.cmd) + '</span>\n' : '') + s.out.map((o) => { const c = corLinha(o); return c ? '<span class="' + c + '">' + esc(o) + '</span>' : esc(o); }).join('\n')).join('\n\n');
}

function digita(pre, b, tok) {
  if (!pre) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const segs = segmentos(b);
  const passos = [];
  segs.forEach((s, si) => {
    if (s.cmd) passos.push({ cmd: s.cmd, si });
    s.out.forEach((o, oi) => passos.push({ out: o, si, oi }));
  });
  const final = pre.innerHTML;
  let html = '';
  let k = 0;
  let segAtual = -1;
  const tick = () => {
    if (tok !== st.token) return;
    if (k >= passos.length) { pre.innerHTML = final; return; }
    const it = passos[k];
    if (it.si !== segAtual) { if (segAtual >= 0) html += '\n\n'; segAtual = it.si; }
    if (it.cmd !== undefined) {
      let c = 0;
      const tecla = () => {
        if (tok !== st.token) return;
        c = Math.min(it.cmd.length, c + 3);
        pre.innerHTML = html + '<span class="t-cmd">' + esc(it.cmd.slice(0, c)) + '</span><span class="cursor"></span>';
        if (c < it.cmd.length) setTimeout(tecla, 14);
        else { html += '<span class="t-cmd">' + esc(it.cmd) + '</span>\n'; k++; setTimeout(tick, 220); }
      };
      tecla();
      return;
    }
    const cl = corLinha(it.out);
    html += (it.oi > 0 ? '\n' : '') + (cl ? '<span class="' + cl + '">' + esc(it.out) + '</span>' : esc(it.out));
    pre.innerHTML = html + '<span class="cursor"></span>';
    k++;
    setTimeout(tick, 34);
  };
  tick();
}

function menuHTML() {
  const usadas = MENU_USADAS[st.perfil];
  return '<div class="menu-g">' + MENU.map(([g, ops]) => '<section><h4>' + esc(g) + '</h4><ul>' + ops.map(([cod, nome, so]) => {
    const oculta = (so === 'c' && st.perfil === 'requisitos') || (so === 'r' && st.perfil === 'completo');
    return '<li class="' + (oculta ? 'oculta' : '') + (usadas.includes(cod) && !oculta ? ' usada' : '') + '"><b>' + esc(cod) + '</b><span>' + esc(nome) + '</span></li>';
  }).join('') + '</ul></section>').join('') + '</div><div class="menu-leg">Riscadas: fora do menu no perfil <code>' + esc(st.perfil) + '</code>. Grifadas: usadas neste simulador.</div>';
}

function descArquivo(path) {
  if (st.perfil === 'requisitos') {
    if (path === 'global/DATA-MODEL.md') return 'Índice **negocial** de entidades, atributos em Label PO e relacionamentos, sem estrutura física de banco. Contagem das funções de dados pela opção CT.';
    if (path === 'global/gates-config.yml') return 'Papéis dos checkpoints deste perfil: CP1 (PO/Negócio) e CP2 (DBA/Arquiteto).';
  }
  if (ARQ.has(path)) return ARQ.get(path);
  if (/^modules\/[^/]+\/README\.md$/.test(path)) return '**N1 — Domínio.** O que o domínio faz e o que não faz, os Agrupamentos Funcionais com as siglas, regras transversais e integrações. Opções 1A (negócio) e 1B (técnico).';
  if (/^modules\/[^/]+\/[^/]+\/README\.md$/.test(path)) return '**N2 — Agrupamento Funcional.** A jornada, as funcionalidades, as telas e as permissões. Antes do N3, ids-n3 reserva a primeira sequência confirmada; preserve o registro docqui:n3-ids e os IDs já usados. Integralmente negocial. Opção 2A.';
  if (/^modules\/.+\/f-[^/]+\.md$/.test(path)) return '**N3 — Funcionalidade.** Campos, regras de negócio, cenários Gherkin e comportamento de tela. O front-matter carrega a esteira (`estado` + `gates`) e a pendência de contagem. Opções 3A/3B, 4A/4B e CT.';
  if (/^analise-impacto\/AIMM-SP/.test(path)) return '**AIMM da sprint.** Consolida os tickets entregues, conta cada função uma vez e traz o apurável que a equipe de métricas audita.';
  if (/^analise-impacto\/AIMM-/.test(path)) return '**AIMM do ticket.** O que o ticket pede, o changeset que a PO avaliza e, no fechamento, o que mudou, com entidades alteradas sem PF e a reconciliação. Opção AIMM; o fechamento é da skill analise-impacto.';
  if (/^qa\//.test(path)) return 'Plano de testes da funcionalidade: converte os Cenários do N3 em roteiro E2E. Artefato do CP3 (opção 5B).';
  if (/^global\/data-models\//.test(path)) return st.perfil === 'requisitos'
    ? 'Fragmento **negocial** do data-model do domínio: entidades, atributos em Label PO e relacionamentos, sem camada física. Opção DM; aprovado no CP2.'
    : 'Fragmento do data-model do domínio: entidades com Label PO, Label Dev, campo banco e tipo, e os ALI do domínio. Passada técnica (3B); aprovado no CP2.';
  return 'Arquivo da instância.';
}

function renderInst(lista) {
  const E = estadoAte(lista, st.idx);
  const vis = [...E.arq.entries()].filter(([, v]) => !v.oculto).map(([k]) => k).sort((a, b) => {
    const da = a.includes('/') ? 0 : 1;
    const db = b.includes('/') ? 0 : 1;
    return da - db || a.localeCompare(b);
  });
  const raiz = { d: new Map(), f: [] };
  for (const path of vis) {
    const partes = path.replace(/\/$/, '').split('/');
    const pasta = path.endsWith('/');
    let n = raiz;
    for (let i = 0; i < partes.length - 1; i++) { if (!n.d.has(partes[i])) n.d.set(partes[i], { d: new Map(), f: [] }); n = n.d.get(partes[i]); }
    n.f.push({ path, nome: partes[partes.length - 1] + (pasta ? '/' : '') });
  }
  const temMud = (n) => n.f.some((f) => E.mud.has(f.path)) || [...n.d.values()].some(temMud);
  const fechadas = st.fechadas || (st.fechadas = new Set(['.github', '.claude', 'prototypes', 'repos', 'modules/_base-conhecimento']));
  const arv = (n, pre) => [...n.d.entries()].map(([nome, sub]) => {
    const full = pre + nome;
    const aberto = !fechadas.has(full) || temMud(sub);
    return '<details data-pasta="' + esc(full) + '"' + (aberto ? ' open' : '') + '><summary>' + esc(nome) + '/</summary>' + arv(sub, full + '/') + '</details>';
  }).join('') + n.f.map((f) => {
    const m = E.mud.get(f.path) || '';
    return '<button class="f ' + m + '" data-arq="' + esc(f.path) + '" title="' + esc(f.path) + '"><span class="nm">' + esc(f.nome) + '</span><span class="pt"></span></button>';
  }).join('');

  const gates = GATES[st.perfil];
  const nOk = (e) => ({ 'rascunho': 0, 'requisitos-aprovados': 1, 'modelo-validado': 2, 'especificado': st.perfil === 'requisitos' ? 2 : 3, 'em-desenvolvimento': 3, 'implementado': 4, 'revisao-necessaria': 4 }[e] ?? 0);
  const feats = [...E.feats.values()].map((f) => {
    const [ic, rot] = ESTADOS[f.estado] || ['·', f.estado];
    const n = nOk(f.estado);
    const g = f.estado === 'a-especificar' || f.estado === 'revertida' ? '' : '<div class="gates">' + gates.map((c, i) => '<span class="' + (i < n ? (f.estado === 'revisao-necessaria' ? 'alerta' : 'ok') : '') + '">' + c + '</span>').join('') + '</div>';
    return '<div class="feat' + (E.fm.has(f.id) ? ' mudou' : '') + (f.estado === 'revertida' ? ' removida' : '') + '"><div class="l1"><span class="id">' + esc(f.id) + '</span><span class="est">' + ic + ' ' + esc(rot) + '</span></div><div class="nm2">' + esc(f.nome) + '</div>' + g + '</div>';
  }).join('');
  const aims = [...E.aims.values()].map((a) => {
    const sprint = /^SP/.test(a.id);
    const etapas = sprint ? ['rascunho', 'concluído'] : AIMM_TICKET;
    const n = a.estado === 'revertida' ? 0 : etapas.indexOf(a.estado) + 1;
    return '<div class="aim' + (E.am.has(a.id) ? ' mudou' : '') + (a.estado === 'revertida' ? ' revertida' : '') + '"><div class="l1"><span class="id">AIMM-' + esc(a.id) + '</span><span>' + esc(a.estado === 'revertida' ? 'revertida → SP08' : a.estado) + '</span></div><div class="trilha" aria-hidden="true">' + etapas.map((_, i) => '<i class="' + (i < n ? 'ok' : '') + '"></i>').join('') + '</div></div>';
  }).join('');
  const commits = E.commits.slice(-7).reverse().map((c) => '<li class="' + (c.novo ? 'novo' : '') + (c.rev ? ' rev' : '') + '">' + esc(c.msg) + '</li>').join('');

  $('#inst').innerHTML =
    '<h2>Instância loja-doc <small>ao fim do passo</small></h2><div class="ficha"><div><span>branch</span><span class="branch">' + esc(E.branch) + '</span></div><div><span>perfil</span><code>' + esc(st.perfil) + '</code></div><div><span>cadência</span><code>sprint</code></div></div>' +
    '<h2>Arquivos <small>clique para ver</small></h2>' + (vis.length ? '<div class="arvore">' + arv(raiz, '') + '</div>' : '<div class="vazio">repositório vazio</div>') +
    '<h2>Esteira por funcionalidade <small>' + gates.join(' → ') + '</small></h2>' + (feats ? '<div class="feats">' + feats + '</div>' : '<div class="vazio">nenhuma funcionalidade ainda</div>') +
    '<h2>AIMMs</h2>' + (aims ? '<div class="aims">' + aims + '</div>' : '<div class="vazio">nenhuma AIMM ainda</div>') +
    '<h2>Commits <small>mais recentes</small></h2>' + (commits ? '<ul class="commits">' + commits + '</ul>' : '<div class="vazio">nenhum commit ainda</div>');
  st.ultimoE = E;
}

function proximoGate(p) {
  if (st.tudo) return null;
  let g = 0;
  for (const b of blocos(p)) if (GATED.has(b.t)) { if (g >= st.rev) return b; g++; }
  return null;
}
function renderCtl(p, lista) {
  const g = proximoGate(p);
  const bp = $('#b-prox');
  if (g) {
    if (g.t === 'term') {
      const seg = segmentos(g)[0];
      bp.innerHTML = '<span class="ico">▶</span>Rodar ' + esc(seg && seg.cmd ? seg.cmd.replace(/^(node|python3?)\s+/, '') : (g.args[0] || ''));
    } else bp.innerHTML = '<span class="ico">✎</span>' + inline(g.args[0] || 'Aplicar a correção');
    bp.disabled = false;
  } else if (st.idx < lista.length - 1) { bp.innerHTML = 'Próximo passo: ' + inline(meta(lista[st.idx + 1], 'titulo')) + ' ›'; bp.disabled = false; }
  else { bp.textContent = 'Fim do simulador'; bp.disabled = true; }
  bp.title = bp.textContent;
  $('#b-ant').disabled = st.idx === 0;
  $('#prog-t').textContent = 'Passo ' + (st.idx + 1) + ' de ' + lista.length + ' · ' + CAPS[p.meta.cap];
  $('#prog-b').style.width = (100 * (st.idx + 1) / lista.length) + '%';
  $('#c-tudo').checked = st.tudo;
}

/* ── Sobreposições: mapa e arquivo ──────────────────────────────────── */
let focoAnterior = null;
function abrir(id) {
  if (!document.querySelector('.ov:not([hidden])')) focoAnterior = document.activeElement;
  document.querySelectorAll('.ov').forEach((o) => { o.hidden = o.id !== id; });
  document.body.style.overflow = 'hidden';
  $('#b-inst').setAttribute('aria-expanded', String(id === 'ov-inst'));
  document.getElementById(id).querySelector('[data-fecha]').focus();
}
function fechar() {
  document.querySelectorAll('.ov').forEach((o) => { o.hidden = true; });
  document.body.style.overflow = '';
  $('#b-inst').setAttribute('aria-expanded', 'false');
  if (focoAnterior) { focoAnterior.focus({ preventScroll: true }); focoAnterior = null; }
}

function abrirArquivo(path) {
  const E = st.ultimoE || estadoAte(passos(), st.idx);
  const c = E.corpo.get(path);
  $('#ov-arq-t').textContent = path;
  let html = '<div class="arq-desc md">' + md([descArquivo(path)]) + '</div>';
  if (c) {
    const i = passos().indexOf(c.passo);
    html += '<div class="arq-meta">Último trecho mostrado no passo ' + (i + 1) + ', <button class="lnk" data-ir="' + i + '">' + inline(meta(c.passo, 'titulo')) + '</button>' +
      (c.corrigido ? ', já com as correções aplicadas (em destaque).' : '.') +
      (c.defasado ? ' O passo ' + (passos().indexOf(c.defasado) + 1) + ' corrige este arquivo de um jeito que o trecho não mostra; a correção está no próprio passo.' : '') + '</div>';
    html += '<div class="arquivo"><pre class="codigo inteiro">' + codigoHTML(c.linhas, 'arq') + '</pre></div>';
  } else html += '<div class="arq-meta">Modelo semeado pelo <code>init-instance</code>, em branco até um passo o preencher.</div>';
  $('#ov-arq-c').innerHTML = html;
  abrir('ov-arq');
}

function renderMapa() {
  const lista = passos();
  ['proc', 'val', 'arq'].forEach((a) => $('#a-' + a).setAttribute('aria-selected', String(st.aba === a)));
  const ocorr = [];
  lista.forEach((p, i) => blocos(p).forEach((b) => { if (b.t === 'term') segmentos(b).forEach((s) => { if (s.script && s.script !== 'git') ocorr.push({ i, p, camada: b.args[1], fase: meta(p, 'fase'), script: s.script, res: s.res }); }); }));
  const mk = (r) => r === 'erro' ? '<span class="mk-err">✗</span>' : r === 'aviso' ? '<span class="mk-warn">⚠</span>' : '<span class="mk-ok">✓</span>';
  let html = '';
  if (st.aba === 'proc') {
    const faseAtual = meta(lista[st.idx], 'fase');
    html += '<div class="md"><p>Cada célula junta o que roda numa camada de validação durante uma fase. Clique num script para ir ao primeiro passo em que ele aparece ali; ✗ marca onde o simulador mostra uma reprovação.</p></div>';
    html += '<div class="mapa"><table><thead><tr><th></th>' + FASES.map((f) => '<th>' + esc(f[1]) + '</th>').join('') + '</tr></thead><tbody>';
    for (const [ck, cn, cd] of CAMADAS) {
      html += '<tr><td class="faixa">' + esc(cn) + '<small>' + esc(cd) + '</small></td>';
      for (const [fk] of FASES) {
        const aqui = ocorr.filter((o) => o.camada === ck && o.fase === fk);
        const por = new Map();
        aqui.forEach((o) => { if (!por.has(o.script)) por.set(o.script, []); por.get(o.script).push(o); });
        html += '<td class="' + (fk === faseAtual ? 'atual' : '') + '">' + [...por].map(([sc, os]) => '<button class="sc" data-ir="' + os[0].i + '">' + esc(sc.replace(/\.(mjs|py)$/, '')) + ' ' + [...new Set(os.map((o) => o.res))].map(mk).join('') + '<span class="r">passo ' + [...new Set(os.map((o) => o.i + 1))].join(', ') + '</span></button>').join('') + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
  } else if (st.aba === 'val') {
    html += '<div class="tab-wrap"><table><thead><tr><th>Script</th><th>Quando roda</th><th>O que confere</th><th>Onde aparece</th></tr></thead><tbody>';
    for (const [nome, d] of SCR) {
      const os = ocorr.filter((o) => o.script === nome);
      const onde = [...new Map(os.map((o) => [o.i, o])).values()].map((o) => '<button class="lnk" data-ir="' + o.i + '">' + (o.i + 1) + '</button>' + mk(os.filter((x) => x.i === o.i).some((x) => x.res === 'erro') ? 'erro' : o.res)).join(' · ');
      html += '<tr><td><code>' + esc(nome) + '</code></td><td>' + esc(d.onde) + '</td><td>' + inline(d.faz) + '</td><td>' + (onde || '<span class="vazio">não aparece neste perfil</span>') + '</td></tr>';
    }
    html += '</tbody></table></div>';
  } else {
    const grupos = [['Raiz e automação', (p) => !p.includes('/') || /^\.(claude|github)\//.test(p)], ['Arquivos globais (global/)', (p) => p.startsWith('global/')], ['Níveis e espelhos (modules/)', (p) => p.startsWith('modules/')], ['Análise de impacto, testes, código e protótipos', (p) => /^(analise-impacto|qa|repos|prototypes)\//.test(p)], ['Sincronizados do engine', (p) => /^(engine|scripts)\/$/.test(p)]];
    for (const [g, f] of grupos) {
      const arquivos = [...ARQ.keys()].filter(f).filter(p => st.perfil !== 'requisitos' || !['global/API-PATTERNS.md', 'global/AUTHZ.md', 'global/PATTERNS.md'].includes(p));
      html += '<section class="mapa-arquivos"><h3 style="font-size:15px">' + esc(g) + '</h3><table><tbody>' + arquivos.map((p) => '<tr><td><code>' + esc(p) + '</code></td><td>' + inline(descArquivo(p)) + '</td></tr>').join('') + '</tbody></table></section>';
    }
  }
  $('#ov-mapa-c').innerHTML = html;
}

/* ── Navegação ──────────────────────────────────────────────────────── */
function fecharRoteiro() { $('#roteiro').classList.remove('aberto'); $('#b-rot').setAttribute('aria-expanded', 'false'); }
function ir(i) { st.idx = i; st.rev = 0; st.novo = false; fechar(); render(); window.scrollTo(0, 0); fecharRoteiro(); }
function avancar() {
  const lista = passos();
  const p = lista[st.idx];
  if (proximoGate(p)) { st.rev++; st.novo = true; render(); return; }
  if (st.idx < lista.length - 1) ir(st.idx + 1);
}
function voltar() { if (st.idx > 0) { st.idx--; st.rev = Infinity; st.novo = false; render(); window.scrollTo(0, 0); } }
function trocaPerfil(pf) {
  if (pf === st.perfil) return;
  const atual = passos()[st.idx];
  st.perfil = pf;
  try { localStorage.setItem('docqui-sim-perfil', pf); } catch (e) { /* sem storage */ }
  const lista = passos();
  let i = lista.indexOf(atual);
  if (i < 0) { const pos = TODOS.indexOf(atual); i = lista.findIndex((p) => TODOS.indexOf(p) > pos); if (i < 0) i = lista.length - 1; }
  st.idx = i; st.rev = 0;
  $('#p-completo').setAttribute('aria-pressed', String(pf === 'completo'));
  $('#p-requisitos').setAttribute('aria-pressed', String(pf === 'requisitos'));
  render();
  if (!$('#ov-github').hidden) fechar();
  if (!$('#ov-mapa').hidden) renderMapa();
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-ir],[data-arq],[data-fecha],[data-expande],[data-github]');
  if (!t) { if (ev.target.classList && ev.target.classList.contains('ov')) fechar(); return; }
  if (t.hasAttribute('data-ir')) ir(+t.getAttribute('data-ir'));
  else if (t.hasAttribute('data-arq')) abrirArquivo(t.getAttribute('data-arq'));
  else if (t.hasAttribute('data-fecha')) fechar();
  else if (t.hasAttribute('data-github')) abrirGitHub(t.getAttribute('data-github'));
  else if (t.hasAttribute('data-expande')) { const pre = t.previousElementSibling; pre.classList.toggle('inteiro'); t.textContent = pre.classList.contains('inteiro') ? 'recolher' : 'ver o trecho inteiro'; }
});
document.addEventListener('toggle', (ev) => {
  const d = ev.target;
  if (!d.matches || !d.matches('details[data-pasta]')) return;
  const k = d.getAttribute('data-pasta');
  if (d.open) st.fechadas.delete(k); else st.fechadas.add(k);
}, true);
$('#b-prox').addEventListener('click', avancar);
$('#b-ant').addEventListener('click', voltar);
$('#p-completo').addEventListener('click', () => trocaPerfil('completo'));
$('#p-requisitos').addEventListener('click', () => trocaPerfil('requisitos'));
$('#c-tudo').addEventListener('change', (e) => { st.tudo = e.target.checked; try { localStorage.setItem('docqui-sim-tudo', st.tudo ? '1' : '0'); } catch (x) { /* sem storage */ } render(); });
$('#b-mapa').addEventListener('click', () => { renderMapa(); abrir('ov-mapa'); });
$('#b-inst').addEventListener('click', () => abrir('ov-inst'));
function abrirGitHub(id) {
  const disponiveis = window.DOCQUI_GITHUB.cenas(st.perfil);
  const cena = disponiveis.find(c => c.id === id) || disponiveis.find(c => c.passo === passos()[st.idx].id) || disponiveis[0];
  window.DOCQUI_GITHUB.mostrar(st.perfil, cena.id);

  resizer.setAttribute('aria-valuenow', String(valor));
  if (salvar) {
    try { localStorage.setItem('docqui-sim-rot-w', String(valor)); }

  }

  document.body.classList.add('redimensionando');
  function mover(ev) { ajustarRoteiro(largura + ev.clientX - inicio); }
  function terminar() {
    document.body.classList.remove('redimensionando');
    ajustarRoteiro(larguraRoteiro(), true);
    resizer.removeEventListener('pointermove', mover);
    resizer.removeEventListener('pointerup', terminar);
    resizer.removeEventListener('pointercancel', terminar);
    resizer.removeEventListener('lostpointercapture', terminar);
  }
  resizer.addEventListener('pointermove', mover);
  resizer.addEventListener('pointerup', terminar);
  resizer.addEventListener('pointercancel', terminar);
  resizer.addEventListener('lostpointercapture', terminar);
});

  ajustarRoteiro(proxima, true);
});
