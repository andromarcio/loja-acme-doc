<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador docqui</title>
<meta name="description" content="Simulador do framework docqui: uma sprint inteira, do repositório vazio à entrega, com os prompts, os arquivos e os validadores em cada passo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: roteiro à esquerda · palco no centro (o passo, bloco a bloco) · a instância à direita.
   Paleta da marca docqui (engine/brand/BRAND.md): Papel, Tinta, Grifo; Planta no escuro. */
:root {
  --bg: #FBF8F0;
  --bg-2: #F5F1E4;
  --bg-3: #ECE6D3;
  --surface: #FFFEFA;
  --line: #E6DECA;
  --line-2: #D6CCB2;
  --fg: #1B2B4B;
  --fg-2: #3C4864;
  --fg-3: #6B7691;
  --accent: #1B2B4B;
  --on-accent: #FBF8F0;
  --accent-soft: rgba(27, 43, 75, 0.08);
  --grifo: #FFD94A;
  --on-grifo: #14213D;
  --ok: #1E7F5C;
  --ok-soft: rgba(30, 127, 92, 0.12);
  --err: #BE4B33;
  --err-soft: rgba(190, 75, 51, 0.11);
  --warn: #8F6408;
  --warn-soft: rgba(255, 217, 74, 0.30);
  --link: #2C4A9C;
  --add: rgba(30, 127, 92, 0.13);
  --del: rgba(190, 75, 51, 0.12);
  --term-bg: #14213D;
  --term-line: #24345A;
  --term-fg: #E6EAF4;
  --term-dim: #8E99B8;
  --term-ok: #4CC495;
  --term-err: #F2896F;
  --term-warn: #FFD94A;
  --term-cmd: #B4C6F2;
  --shadow: 0 10px 30px rgba(20, 33, 61, 0.14);
  --font-display: "Sora", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  --font-text: "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --top-h: 56px;
  --ctl-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B33; --bg-2: #131F3A; --bg-3: #1A2848; --surface: #16233F; --line: #24325A; --line-2: #2E3D6B;
    --fg: #EAE7DB; --fg-2: #C3C9DA; --fg-3: #8E99B8; --accent: #EAE7DB; --on-accent: #0F1B33; --accent-soft: rgba(234, 231, 219, 0.08);
    --ok: #4CC495; --ok-soft: rgba(76, 196, 149, 0.15); --err: #E8836B; --err-soft: rgba(232, 131, 107, 0.15);
    --warn: #E3B83D; --warn-soft: rgba(255, 217, 74, 0.14); --link: #A8BCF0;
    --add: rgba(76, 196, 149, 0.16); --del: rgba(232, 131, 107, 0.16);
    --term-bg: #0A1426; --term-line: #1E2C4C; --shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B33; --bg-2: #131F3A; --bg-3: #1A2848; --surface: #16233F; --line: #24325A; --line-2: #2E3D6B;
  --fg: #EAE7DB; --fg-2: #C3C9DA; --fg-3: #8E99B8; --accent: #EAE7DB; --on-accent: #0F1B33; --accent-soft: rgba(234, 231, 219, 0.08);
  --ok: #4CC495; --ok-soft: rgba(76, 196, 149, 0.15); --err: #E8836B; --err-soft: rgba(232, 131, 107, 0.15);
  --warn: #E3B83D; --warn-soft: rgba(255, 217, 74, 0.14); --link: #A8BCF0;
  --add: rgba(76, 196, 149, 0.16); --del: rgba(232, 131, 107, 0.16);
  --term-bg: #0A1426; --term-line: #1E2C4C; --shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg-2);
  font-family: var(--font-text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); color: var(--fg); text-wrap: balance; margin: 0; }
code, kbd, pre { font-family: var(--font-mono); }
code { font-size: 0.86em; background: var(--bg-3); color: var(--fg); padding: 0.08em 0.36em; border-radius: 4px; overflow-wrap: anywhere; }
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
strong { color: var(--fg); font-weight: 600; }

/* ── Barra superior ───────────────────────────────── */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-height: var(--top-h); padding: 8px 16px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca svg { width: 26px; height: 26px; flex: none; }
.marca b { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--fg); letter-spacing: -0.01em; }
.marca span { font-size: 12.5px; color: var(--fg-3); white-space: nowrap; }
.top .espaco { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg-rot { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); margin-right: 6px; }
.btn-top { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.btn-top:hover { background: var(--bg-2); }
.so-estreito { display: none; }

/* ── Colunas ─────────────────────────────────────── */
.cols { display: grid; grid-template-columns: var(--rot-w, 268px) 6px minmax(0, 1fr); align-items: start; }
.rot, .alca {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  max-height: calc(100dvh - var(--top-h) - var(--ctl-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.rot { overflow: auto; overscroll-behavior: contain; padding: 14px 10px 24px 14px; }
/* A alça entre o roteiro e o conteúdo: arraste (ou ← → com foco) muda a largura do roteiro. */
.alca { height: 100dvh; border-left: 1px solid var(--line); cursor: col-resize; touch-action: none; }
.alca:hover, .alca:focus-visible, .alca.arrastando { background: var(--line-2); outline: none; }
body.arrastando-rot { user-select: none; cursor: col-resize; }
/* O painel da instância é uma gaveta sobreposta: abre e fecha pelo botão do topo sem mexer no conteúdo.
   Fica abaixo do rodapé (z-index 25), para os controles do passo seguirem à mão com ela aberta. */
.inst {
  position: fixed; z-index: 24; right: 0; top: calc(var(--top-real, var(--top-h)) + env(safe-area-inset-top, 0px)); bottom: 0;
  width: min(340px, 92vw); overflow: auto; overscroll-behavior: contain;
  padding: 14px 14px calc(var(--ctl-h) + 24px); background: var(--bg-2); border-left: 1px solid var(--line);
  box-shadow: var(--shadow); transform: translateX(105%); transition: transform 0.2s; visibility: hidden;
}
.inst.aberto { transform: none; visibility: visible; }
.stage { min-width: 0; padding: 22px 28px calc(var(--ctl-h) + 40px); }
.stage-in { display: flex; flex-direction: column; gap: 16px; }

/* ── Roteiro ─────────────────────────────────────── */
.cap { margin: 10px 0 4px; }
.cap h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--fg-3); font-family: var(--font-text); font-weight: 600; padding: 6px 6px 4px; }
.rot ol { list-style: none; margin: 0; padding: 0; }
.rot li button {
  display: grid; grid-template-columns: 28px 1fr; gap: 6px; width: 100%; text-align: left;
  border: 0; background: none; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.35; color: var(--fg-2);
}
.rot li button:hover { background: var(--bg-2); }
.rot li .n { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); padding-top: 1px; font-variant-numeric: tabular-nums; }
.rot li.feito button { color: var(--fg-3); }
.rot li.atual button { background: var(--accent); color: var(--on-accent); }
.rot li.atual .n { color: var(--on-accent); opacity: 0.75; }
.rot .tag-p { font-size: 10px; font-family: var(--font-mono); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 4px; opacity: 0.7; white-space: nowrap; }

/* ── Cabeçalho do passo ──────────────────────────── */
.cab { display: flex; flex-direction: column; gap: 12px; }
.fases { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.fase { flex: none; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-3); white-space: nowrap; }
.fase.on { background: var(--grifo); color: var(--on-grifo); border-color: var(--grifo); font-weight: 600; }
.fase.feita { color: var(--fg-2); border-color: var(--line-2); background: var(--surface); }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cab h1 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; letter-spacing: -0.015em; }
.cab-linha { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.quem { display: flex; gap: 6px; flex-wrap: wrap; }
.pessoa { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--fg-2); }
.carimbo {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg);
  border: 1.5px dashed var(--fg-3); padding: 3px 9px; border-radius: 4px; transform: rotate(-2deg); display: inline-block; max-width: 100%; overflow-wrap: anywhere;
}
.niveis { display: inline-flex; align-items: flex-end; gap: 3px; height: 26px; }
.niveis i { display: block; width: 9px; border-radius: 2px; background: var(--line-2); }
.niveis i:nth-child(1) { height: 10px; } .niveis i:nth-child(2) { height: 15px; } .niveis i:nth-child(3) { height: 20px; } .niveis i:nth-child(4) { height: 25px; }
.niveis i.on { background: var(--fg); }
.niveis i.on:nth-child(4) { background: var(--grifo); box-shadow: inset 0 0 0 1px var(--on-grifo); }
.niveis-l { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
.camadas { display: flex; gap: 6px; flex-wrap: wrap; }
.camada { font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--fg-2); }
.camada b { font-weight: 600; color: var(--fg); }

/* ── Blocos ──────────────────────────────────────── */
.bloco { min-width: 0; }
.intro p { margin: 0 0 10px; font-size: 16px; color: var(--fg-2); max-width: 68ch; }
.intro p:last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md ul { margin: 4px 0 8px; padding-left: 20px; } .md li { margin: 2px 0; }
.tab-wrap { overflow-x: auto; margin: 6px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--fg); background: var(--bg-2); font-size: 12.5px; }

.nota { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px 14px; }
.nota .rotulo { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; }
.nota.regra .rotulo { color: var(--fg); }
.nota.atencao { border-color: var(--err); background: var(--err-soft); }
.nota.atencao .rotulo { color: var(--err); }
.nota.perfil { border-style: dashed; border-color: var(--line-2); }
.nota.dica { background: var(--bg-2); }

.ticket { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); overflow: hidden; }
.ticket-cab { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); font-size: 12.5px; }
.ticket-cab .chave { font-family: var(--font-mono); font-weight: 600; color: var(--fg); }
.ticket-cab .ferr { margin-left: auto; color: var(--fg-3); }
.ticket-corpo { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.ticket-corpo h3 { font-size: 17px; }
.ticket-corpo .desc { font-size: 15px; color: var(--fg); }
.cas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.cas li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; font-size: 14px; }
.cas li b { font-family: var(--font-mono); font-size: 12px; color: var(--fg); padding-top: 2px; }

.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--bg-3); color: var(--fg); font-family: var(--font-display); }
.msg.claude .av { background: var(--accent); color: var(--on-accent); }
.msg.hook .av { background: var(--warn-soft); color: var(--warn); font-family: var(--font-mono); font-size: 10px; }
.msg .quem-m { font-size: 12px; color: var(--fg-3); margin-bottom: 1px; }
.msg .txt { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 10px 10px 10px; padding: 8px 12px; font-size: 14.5px; color: var(--fg); min-width: 0; }
.msg.hook .txt { font-family: var(--font-mono); font-size: 12.5px; background: var(--warn-soft); border-color: transparent; color: var(--fg); white-space: pre-wrap; }
.estado-tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-3); }

.arquivo { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); overflow: hidden; }
.arq-cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
.arq-cab .path { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); overflow-wrap: anywhere; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.arq-cab .path:hover { text-decoration: underline; }
.badge { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-3); white-space: nowrap; }
.badge.novo { color: var(--ok); border-color: var(--ok); }
.badge.alterado { color: var(--warn); border-color: var(--warn); }
.badge.removido { color: var(--err); border-color: var(--err); }
.codigo { margin: 0; padding: 10px 0; font-size: 12.5px; line-height: 1.55; overflow-x: auto; max-height: 460px; overflow-y: auto; }
.codigo.inteiro { max-height: none; }
.codigo .l { display: block; padding: 0 14px; white-space: pre; min-height: 1.55em; }
.codigo .l.hl { background: var(--warn-soft); }
.codigo .l.add { background: var(--add); }
.codigo .l.del { background: var(--del); }
.codigo .l.ctx { color: var(--fg-3); }
.codigo .l.arq { color: var(--fg-3); font-weight: 600; padding-top: 6px; }
.k-h { color: var(--fg); font-weight: 700; }
.k-fm { color: var(--fg-3); }
.k-c { color: var(--fg-3); font-style: italic; }
.k-g { color: var(--link); font-weight: 600; }
.k-r { color: var(--ok); }
.k-p { color: var(--line-2); }
.ver-tudo { border: 0; border-top: 1px solid var(--line); width: 100%; background: var(--bg-2); padding: 5px; font-size: 12px; cursor: pointer; color: var(--fg-3); }

.term { border-radius: 8px; overflow: hidden; background: var(--term-bg); border: 1px solid var(--term-line); }
.term-cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 12px; border-bottom: 1px solid var(--term-line); font-size: 12px; color: var(--term-dim); }
.term-cab .via { font-family: var(--font-mono); color: var(--term-fg); }
.term-cab .res { margin-left: auto; font-weight: 600; font-family: var(--font-mono); font-size: 11.5px; padding: 1px 8px; border-radius: 4px; }
.res.ok { color: var(--term-ok); background: rgba(76, 196, 149, 0.12); }
.res.erro { color: var(--term-err); background: rgba(242, 137, 111, 0.13); }
.res.aviso { color: var(--term-warn); background: rgba(255, 217, 74, 0.1); }
.term pre { margin: 0; padding: 12px 14px; color: var(--term-fg); font-size: 12.5px; line-height: 1.55; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.t-cmd { color: var(--term-cmd); }
.t-cmd::before { content: "$ "; color: var(--term-dim); }
.t-ok { color: var(--term-ok); } .t-err { color: var(--term-err); } .t-warn { color: var(--term-warn); } .t-dim { color: var(--term-dim); }
.cursor { display: inline-block; width: 7px; height: 1.1em; background: var(--term-fg); vertical-align: text-bottom; animation: pisca 1s steps(1) infinite; }
@keyframes pisca { 50% { opacity: 0; } }

.fix { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); overflow: hidden; }
.fix-cab { padding: 8px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.fix-txt { padding: 10px 14px 0; font-size: 14px; }
.fix .codigo { max-height: none; }

.menu-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.menu-g section { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 9px 11px; }
.menu-g h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-weight: 600; }
.menu-g ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.menu-g li { display: grid; grid-template-columns: 38px 1fr; gap: 6px; font-size: 13px; align-items: baseline; }
.menu-g li b { font-family: var(--font-mono); font-size: 12px; color: var(--fg); }
.menu-g li.oculta { opacity: 0.38; text-decoration: line-through; }
.menu-g li.usada b { box-shadow: inset 0 -0.45em 0 var(--warn-soft); }
.menu-leg { font-size: 12.5px; color: var(--fg-3); margin-top: 8px; }

.novo-bloco { animation: entra 0.35s ease-out; }
@keyframes entra { from { opacity: 0.25; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── Instância (painel direito) ──────────────────── */
.inst h2 { font-size: 13px; font-family: var(--font-text); text-transform: uppercase; letter-spacing: 0.09em; color: var(--fg-3); font-weight: 600; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.inst h2:first-child { margin-top: 0; }
.inst h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11.5px; }
.ficha { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.ficha div { display: flex; justify-content: space-between; gap: 10px; }
.ficha span { color: var(--fg-3); }
.ficha code { font-size: 12px; }
.branch { font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); padding: 1px 7px; border-radius: 4px; }
.arvore { font-size: 12.5px; font-family: var(--font-mono); }
.arvore details { margin-left: 0; }
.arvore details details, .arvore details > .f { margin-left: 13px; }
.arvore summary { cursor: pointer; color: var(--fg-2); padding: 1px 0; list-style: none; display: flex; gap: 5px; align-items: center; }
.arvore summary::-webkit-details-marker { display: none; }
.arvore summary::before { content: "▸"; color: var(--fg-3); font-size: 10px; width: 9px; }
.arvore details[open] > summary::before { content: "▾"; }
.arvore .f { display: flex; align-items: center; gap: 6px; width: calc(100% - 13px); border: 0; background: none; padding: 1px 4px; border-radius: 4px; cursor: pointer; text-align: left; color: var(--fg-2); font-family: var(--font-mono); font-size: 12.5px; }
.arvore .f:hover { background: var(--bg-3); }

<script type="text/plain" id="dados-arquivos">
CLAUDE.md :: Índice de contexto que o Claude Code carrega em toda sessão. Importa o MASTER, o N0 e o INDEX; os demais arquivos são lidos sob demanda pela skill analista-requisitos.
README.md :: Apresentação da instância.
VERSION :: Versão do engine sincronizado (6.1.0). Todo artefato gerado leva o carimbo invisível `<!-- docqui: 6.1.0 | prompt: … -->` na primeira linha.
.gitignore :: Arquivos que o git ignora.
.claude/settings.json :: Registra o hook `spec-guard`: F1 e F4 ao receber a mensagem, F5 antes de comando git destrutivo, F2 · F3 · F6 · F7 · F8 a cada arquivo gravado. É o que faz os validadores rodarem sozinhos na sessão.
.github/CODEOWNERS :: Quem aprova cada checkpoint: `modules/` convoca a PO (CP1), `DATA-MODEL` o DBA (CP2), `qa/` a QA (CP3), `repos/` o Tech Lead (CP4).
.github/README.md :: Passo a passo para adotar a esteira na instância.
.github/pull_request_template.md :: Modelo do PR: o checkpoint e a chave do ticket.
.github/workflows/gate-check.yml :: Status check que bloqueia o PR: ordem dos gates, um gate por PR, espelho do INDEX em dia e o artefato da etapa no mesmo PR.
.github/workflows/spec-guard.yml :: A CI de cada PR: validate-doc, audit-trace-links, suspect-links, validate-impact, índice de uso dos dicionários e diagrama ER. No PR da branch de entrega, também valida-commits-ticket e, para a main, valida-entrega.
.github/workflows/promote-estado.yml :: Rede de segurança depois do merge: acusa o espelho da esteira defasado no INDEX, sem push na main.
.github/workflows/pages.yml :: Publica o site: a main na raiz e cada branch de entrega aberta em /sprint/<id>/ ou /historia/<CHAVE>/.
global/MASTER.md :: Identidade do sistema (sigla, nome), arquétipo, **Perfil** e **Cadência**, convenções de IDs e de nomenclatura. Fonte única: o N0 repete a sigla daqui.
global/N0_PRODUCT_VISION.md :: **N0 — Visão de Produto.** Por que o produto existe, para quem, objetivos, KPIs, o que está dentro e fora do escopo e os Major Feature Sets previstos. Opção N0. Mantido pela PO.
global/DATA-MODEL.md :: Índice do modelo de dados: modelos por domínio, enums, campos recentes e os **Arquivos Lógicos (APF)**, onde se contam as funções de dados.
global/FIELD-DICTIONARY.md :: Campos canônicos (CPF, CEP, e-mail…): validação e mensagem escritas uma vez. O N3 cita `→ ver FIELD-DICTIONARY: CEP` em vez de reescrever.
global/RULES-DICTIONARY.md :: Regras de negócio canônicas `RC-NN`, citadas pelos N3 pelo ID.
global/MESSAGE-DICTIONARY.md :: O texto literal de toda mensagem de interface: o baseline genérico e as chaves por domínio, como `VND_CEP_NAO_ATENDIDO`.
global/ERROR-DICTIONARY.md :: Fonte única dos códigos de erro, preenchida na passada técnica.
global/NFR.md :: Requisitos não-funcionais com limiar mensurável (DES-01: frete em p95 < 2 s). Opção NF.
global/SIZING.md :: Convenções de contagem APF (IFPUG CPM 4.3.1) e COSMIC: tabelas de complexidade, papel do processo elementar, PE reutilizado.
global/CONTAGEM-PF.md :: Consolidado da contagem: espelha a `## Métricas de tamanho` dos N3 e os ALI do DATA-MODEL. Nunca recebe número que não exista na fonte.
global/ALI-AIE-MAP.md :: Registro dos ALI e AIE válidos e das entidades que os constituem.
global/API-PATTERNS.md :: Padrões de API (versão na rota, envelope de resposta), conferidos pelo validate-doc na seção `## API` do N3.
global/AUTHZ.md :: Modelo de autorização: a feature é o átomo de permissão.
global/DESIGN-SYSTEM.md :: Padrões de interface usados pelos protótipos.
global/PATTERNS.md :: Catálogo de padrões de projeto (Strategy, Repository…), consumido pelo SDD.

modules/INDEX.md :: Visão consolidada: domínios, rastreabilidade ticket → feature → código, a **esteira de checkpoints** (gerada pelo gates.py) e as pendências (geradas pela opção PD). É espelho, não fonte.

analise-impacto/_TEMPLATE_AIM.md :: Modelo da AIM do ticket.

repos/INDEX.md :: Inventário dos repositórios de código. A feature implementada declara o repositório na `## Implementação`, e ele precisa constar aqui.

<script type="text/plain" id="dados-scripts">
preflight-spec.mjs :: sessão · F1 :: Panorama do que já existe (N0, N1, N2, N3 com IDs e o próximo número livre) antes de especificar. Informativo, sempre sai 0.
validate-doc.mjs :: ao gravar · F2 · CI :: Estrutura de N0 a N3 e do data-model: título, subtítulo de nível, seções obrigatórias, a sigla do MASTER, o repositório da implementação.
validate-feature-semantics.mjs :: ao gravar · F2 :: O N3 é mesmo uma feature? FD-1 a FD-9 reprovam (verbo, atomicidade, regra invariante, descrição da entrega); FD-10 a FD-12 e [MSG] avisam.
valida-citacoes-dicionario.mjs :: ao gravar · F6 :: Toda citação `→ ver <X>-DICTIONARY: alvo` tem entrada no dicionário.

valida-enumeracao-contagem.mjs :: ao gravar · F8 :: A memória de cálculo de cada processo elementar é um bloco JSON de nomes, do tamanho do ALR e do DER da tabela.

gates.py :: esteira · CI :: Máquina de estados dos checkpoints: ordem, um gate por PR, quem e quando, estado derivado, artefato da etapa. Regenera o espelho no INDEX.
valida-contagem-consolidada.mjs :: contagem :: O CONTAGEM-PF espelha a contagem dos N3: o PF, a pendência e o papel de cada processo elementar.

monta-site-preview.mjs :: CI · Pages :: Monta o site com a main na raiz e cada branch de entrega aberta ao lado.

<script type="text/plain" id="dados-passos">
=== inicio
cap: A
fase: prep
titulo: Como usar este simulador
niveis: N0 N1 N2 N3
quem: você
--- intro
O **docqui** especifica software em quatro níveis, da visão de produto (N0) à feature descrita campo a campo (N3). Prompts conduzem a escrita; scripts conferem o resultado. Este simulador acompanha a equipe da **Loja Acme** do repositório vazio até a entrega de uma sprint com três histórias.

Em cada passo você vê quem trabalha, que opção do menu roda, o arquivo que nasce ou muda e o validador que confere. Quando um validador reprova, você lê a saída real, aplica a correção e roda de novo.
--- nota conceito
| Nível | Pergunta que responde | Arquivo |
|---|---|---|
| **N0** · Visão de Produto | Por que este software existe? | `global/N0_PRODUCT_VISION.md` |
| **N1** · Major Feature Set | Quais são as grandes áreas do sistema? | `modules/<dominio>/README.md` |
| **N2** · Feature Set | O que o usuário faz em cada área? | `modules/<dominio>/<feature-set>/README.md` |
| **N3** · Feature | Como funciona, em detalhe, cada funcionalidade? | `modules/<dominio>/<feature-set>/f-<verbo>-<entidade>.md` |
--- nota dica
O botão principal, embaixo à direita, avança: roda o próximo comando, aplica a próxima correção ou passa ao passo seguinte. As setas → e ← do teclado fazem o mesmo. Clique num arquivo da instância, à direita, para ver o que ele é e a versão mais recente. **Mapa** mostra o processo inteiro, cada validador e cada arquivo global. Para dar aula sem cliques, marque *mostrar o passo inteiro*.
--- nota perfil

# Calcular Frete
> **Nível 3** - Feature Set: Checkout — Major Feature Set: Vendas - `VND-CHK-01`

## Descrição

Permite que o cliente calcule o frete do pedido pelo CEP de entrega, vendo o valor antes de confirmar a compra.

No checkout, o cliente digita o CEP e aciona Calcular; o valor aparece ao lado do total.

## Origem

| Ticket (AIM) | Tipo | Critérios cobertos |
|---|---|---|
| [`STRY0013101`](../../../analise-impacto/AIM-STRY0013101.md) | Criação | `CA-1, CA-2, CA-3` — valor do frete pelo CEP, CEP inválido e CEP fora da área |

## Superfície

**Ação em tela** — origem: Checkout (`/checkout`)

## Regras de negócio

1. O frete é o valor da faixa de CEP da Tabela de Frete que contém o CEP de entrega.
» 2. CEP fora de todas as faixas não é atendido; caso contrário, o sistema não salva e exibe mensagem.
»    → ver FIELD-DICTIONARY: CEP

## Cenários

```gherkin
Feature: Calcular Frete

  Background:
    Given que o cliente está no checkout com itens no carrinho

  Scenario: frete calculado pelo CEP
    When o cliente informa o CEP "01310-100"
    And clica em "Calcular"
    Then o sistema mostra "Frete: R$ 18,90"

  Scenario: CEP inválido
    When o cliente informa o CEP "0131"
    Then o sistema exibe abaixo do campo: "Formato inválido."
    # ← MESSAGE-DICTIONARY: BASELINE

  Scenario: CEP fora da área de entrega
    When o cliente informa o CEP "69900-000"
    And clica em "Calcular"
    Then o sistema exibe: "Ainda não entregamos neste CEP."
```

|---|---|---|---|---|---|---|
| CEP de entrega | Pedido | entrada do usuário | editável | texto | sim | 8 dígitos |
| Valor do frete | Tabela de Frete | calculado | somente leitura | número | — | — |

## Campos automáticos

| Label PO | Valor | Quando |

| Valor do frete | valor da faixa de CEP | ao calcular |

# Consultar Resumo do Pedido
> **Nível 3** - Feature Set: Checkout — Major Feature Set: Vendas - `VND-CHK-02`

## Descrição

Permite que o cliente consulte o resumo do pedido antes de confirmar, com o valor do frete e o prazo de entrega prometido.

No checkout, depois de calcular o frete, o cliente abre o resumo pelo botão Revisar pedido.

## Superfície

**Modal** — origem: Checkout (`/checkout`)

## Regras de negócio

1. O prazo prometido é o prazo da faixa de CEP no momento do cálculo do frete.

Com as AIMs fechadas e o cupom fora, o portão libera. O merge da branch na `main` **é** a entrega: a `main` volta a ser o retrato do que está em produção.

--- nota conceito
No mesmo PR, o `gate-check` confere a esteira **commit a commit**: na branch da sprint, cada PR de checkpoint mesclado aprovou um gate só, na ordem. Comparada de uma vez com a `main`, a branch pareceria aprovar dois gates juntos em cada feature.

    let cls = '';
    if (modo === 'diff') {

  }).join('');
}

/* ── Terminal: segmentos por comando e resultado ────────────────────── */
function segmentos(b) {
  const segs = [];
  let cur = null;
  for (const l of b.linhas) {
    if (l.startsWith('$ ')) { cur = { cmd: l.slice(2), out: [] }; segs.push(cur); continue; }
    if (!cur) { cur = { cmd: '', out: [] }; segs.push(cur); }
    cur.out.push(l);
  }
  for (const s of segs) {
    const m = s.cmd.match(/scripts\/([\w./-]+?\.(?:mjs|py|sh))|^(git)\b/);
    s.script = m ? (m[1] ? m[1].replace(/^.*\//, '') : 'git') : '';
    s.res = s.out.some((o) => /^\s*(✗|❌)/.test(o) || /^\s*- .*\[FD-\d+\]/.test(o)) ? 'erro'
      : s.out.some((o) => /^\s*(⚠|!|⚫)/.test(o) || /aviso\(s\)/.test(o)) ? 'aviso' : 'ok';
  }
  return segs;
}
const resultado = (segs) => segs.some((s) => s.res === 'erro') ? 'erro' : segs.some((s) => s.res === 'aviso') ? 'aviso' : 'ok';
const RES_TXT = { ok: '✓ passou', erro: '✗ reprovou', aviso: '✓ passou, com avisos' };
function corLinha(o) {
  if (/^\s*(✗|❌|- .*\[FD-)/.test(o)) return 't-err';
  if (/^\s*(✓|✔)/.test(o)) return 't-ok';
  if (/^\s*(⚠|!|🔴|🟠|🟡|⚫)/.test(o)) return 't-warn';
  if (/^\s*(→|\(|Regra:|Próximos|A main|Cada commit|Corrija|Acerte|Nenhum|  \d\.)/.test(o)) return 't-dim';
  return '';
}

/* ── Estado da instância: reproduz os passos até o atual ────────────── */
function estadoAte(lista, idx) {
  const E = { arq: new Map(), mud: new Map(), corpo: new Map(), feats: new Map(), aims: new Map(), branch: '—', commits: [], fm: new Set(), am: new Set() };
  lista.slice(0, idx + 1).forEach((p, i) => {
    const atual = i === idx;
    const marca = (path, op) => {
      if (op === '-') { if (E.arq.has(path)) E.arq.get(path).rem = true; }
      else if (!E.arq.has(path) || E.arq.get(path).rem) E.arq.set(path, { desde: p.id });
      if (atual) E.mud.set(path, op === '-' ? 'removido' : (op === '+' ? 'novo' : 'alterado'));
    };
    for (const b of p.blocos.filter(vale)) {
      if (b.t === 'file') {
        const path = b.args[0];
        marca(path, E.arq.has(path) && !E.arq.get(path).rem ? '~' : '+');
        E.corpo.set(path, { linhas: b.linhas, passo: p, rot: b.args[1] || '' });
      } else if (b.t === 'fix') {
        for (const [path, diff] of secoesDiff(b.linhas)) {
          if (path.startsWith('(')) continue;
          marca(path, E.arq.has(path) && !E.arq.get(path).rem ? '~' : '+');
          const c = E.corpo.get(path);
          if (!c) continue;
          const novo = aplicaDiff(c.linhas, diff);
          if (novo) E.corpo.set(path, { ...c, linhas: novo, corrigido: p, defasado: null });
          else E.corpo.set(path, { ...c, defasado: p });
        }
      } else if (b.t === 'fx') {
        for (const raw of b.linhas) {
          const l = raw.trim();
          let m;
          if ((m = l.match(/^([+~-])\s+(.+)$/))) marca(m[2].trim(), m[1]);
          else if ((m = l.match(/^feat\s+(\S+)\s+(\S+)(?:\s+\|\s+(.+))?$/))) {
            const f = E.feats.get(m[1]) || { id: m[1], nome: '' };
            f.estado = m[2]; if (m[3]) f.nome = m[3];
            E.feats.set(m[1], f); if (atual) E.fm.add(m[1]);
          } else if ((m = l.match(/^aim\s+(\S+)\s+(\S+)$/))) {
            const a = E.aims.get(m[1]) || { id: m[1] };
            a.estado = m[2]; E.aims.set(m[1], a); if (atual) E.am.add(m[1]);
          } else if ((m = l.match(/^branch\s+(\S+)$/))) E.branch = m[1];
          else if ((m = l.match(/^commit\s+(.+)$/))) E.commits.push({ msg: m[1], novo: atual, rev: /^Revert/.test(m[1]) });
        }
      }
    }
    if (!atual) for (const v of E.arq.values()) if (v.rem) v.oculto = true;
  });
  return E;
}

/* Aplica o diff de uma correção ao último trecho mostrado do arquivo, para o visualizador
   abrir a versão corrigida. "…" no diff vale por qualquer texto; o que ele cobriu na linha
   removida volta na linha acrescentada. Se uma linha não casa, devolve null. */
function secoesDiff(linhas) {
  const out = [];
  let cur = null;
  for (const l of linhas) {
    if (l.startsWith('@ ')) { cur = [l.slice(2).trim(), []]; out.push(cur); continue; }
    if (cur) cur[1].push(l);
  }
  return out;
}
function aplicaDiff(linhas, diff) {
  const corpo = linhas.map((l) => l.replace(/^» ?/, ''));
  const norm = (l) => l.trim();
  const re = (l) => new RegExp('^' + l.trim().split('…').map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('(.*?)') + '$');
  // Linha acrescentada entra logo depois da linha de contexto ou da removida que a precede.
  // "(…)" no diff marca um trecho omitido: o que vem depois dela entra antes da próxima âncora.
  let pos = 0;
  let caps = [];
  let imediato = false;
  let pend = [];
  for (const d of diff) {
    let tipo;
    let txt;
    if (d.startsWith('+ ') || d === '+') { tipo = '+'; txt = d.slice(2); }
    else if (d.startsWith('- ') || d === '-') { tipo = '-'; txt = d.slice(2); }
    else { tipo = ' '; txt = d.startsWith('  ') ? d.slice(2) : d; }
    if (tipo === '+') {
      let k = 0;
      const t = txt.includes('…') && caps.length ? txt.replace(/…/g, () => caps[k++] ?? '…') : txt;
      const linha = t.trim() ? '» ' + t : '';
      if (imediato) corpo.splice(pos++, 0, linha); else pend.push(linha);
      continue;
    }
    if (!txt.trim()) continue;
    if (/^\(…/.test(txt.trim())) { imediato = false; continue; }
    const r = re(txt);
    let idx = -1;
    let m = null;
    for (let i = pos; i < corpo.length; i++) { m = norm(corpo[i]).match(r); if (m) { idx = i; break; } }
    if (idx < 0) return null;
    if (pend.length) { corpo.splice(idx, 0, ...pend); idx += pend.length; pend = []; }
    if (tipo === '-') { caps = m.slice(1); corpo.splice(idx, 1); pos = idx; } else pos = idx + 1;
    imediato = true;
  }
  if (pend.length) corpo.splice(pos, 0, ...pend);
  return corpo;
}

/* ── Renderização ───────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const stageIn = $('#stage-in');

function render() {
  const lista = passos();
  st.idx = Math.max(0, Math.min(st.idx, lista.length - 1));
  const p = lista[st.idx];
  renderRoteiro(lista);
  renderPalco(p, lista);
  renderInst(lista);
  renderCtl(p, lista);
  try { history.replaceState(null, '', '#' + p.id); } catch (e) { /* sandbox */ }
}

function renderRoteiro(lista) {
  let html = '';
  let cap = '';
  lista.forEach((p, i) => {
    if (p.meta.cap !== cap) { if (cap) html += '</ol></div>'; cap = p.meta.cap; html += '<div class="cap"><h3>' + esc(cap + ' · ' + CAPS[cap]) + '</h3><ol>'; }
    const so = p.meta.perfil ? '<span class="tag-p">só ' + esc(p.meta.perfil) + '</span>' : '';
    html += '<li class="' + (i === st.idx ? 'atual' : i < st.idx ? 'feito' : '') + '"><button data-ir="' + i + '"' + (i === st.idx ? ' aria-current="step"' : '') + '><span class="n">' + String(i + 1).padStart(2, '0') + '</span><span>' + inline(meta(p, 'titulo')) + so + '</span></button></li>';
  });
  $('#roteiro').innerHTML = html + '</ol></div>';
  const at = $('#roteiro li.atual');
  if (at && at.scrollIntoView) at.scrollIntoView({ block: 'nearest' });
}

function cabecalho(p, lista) {
  const fase = meta(p, 'fase');
  const fi = FASES.findIndex((f) => f[0] === fase);
  const fases = FASES.map((f, i) => '<span class="fase ' + (i === fi ? 'on' : i < fi ? 'feita' : '') + '">' + esc(f[1]) + '</span>').join('');
  const niv = meta(p, 'niveis').split(/\s+/).filter(Boolean);
  const barras = niv.length ? '<span class="niveis-l"><span class="niveis" aria-hidden="true">' + ['N0', 'N1', 'N2', 'N3'].map((n) => '<i class="' + (niv.includes(n) ? 'on' : '') + '"></i>').join('') + '</span>' + esc(niv.join(' · ')) + '</span>' : '';
  const quem = meta(p, 'quem').split(' · ').filter(Boolean).map((q) => '<span class="pessoa">' + esc(q) + '</span>').join('');
  const prompt = meta(p, 'prompt');
  const carimbo = prompt ? '<span class="carimbo" title="opção do menu · prompt">docqui · v6.1.0 · ' + esc(prompt) + '</span>' : '';
  const camadas = new Map();
  for (const b of blocos(p)) if (b.t === 'term') {
    const c = CAMADAS.find((x) => x[0] === b.args[1]);
    if (!c) continue;
    const scripts = segmentos(b).map((s) => s.script).filter((s) => s && s !== 'git');
    const set = camadas.get(c[1]) || new Set();
    scripts.forEach((s) => set.add(s.replace(/\.(mjs|py)$/, '')));
    camadas.set(c[1], set);
  }
  const cam = [...camadas].filter(([, s]) => s.size).map(([c, s]) => '<span class="camada"><b>' + esc(c) + '</b> · ' + esc([...s].join(', ')) + '</span>').join('');
  return '<div class="cab"><div class="fases" aria-label="Fase do processo">' + fases + '</div>' +
    '<div class="eyebrow"><span>Passo ' + (st.idx + 1) + ' de ' + lista.length + '</span><span>' + esc(p.meta.cap + ' · ' + CAPS[p.meta.cap]) + '</span></div>' +
    '<h1>' + inline(meta(p, 'titulo')) + '</h1>' +
    '<div class="cab-linha"><div class="quem">' + quem + '</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' + barras + carimbo + '</div></div>' +
    (cam ? '<div class="camadas" aria-label="Validações deste passo">' + cam + '</div>' : '') + '</div>';
}

function renderPalco(p, lista) {
  st.token++;
  const tok = st.token;
  const bs = blocos(p);
  let html = cabecalho(p, lista);
  let g = 0;
  let animar = null;
  let ultimo = -1;
  bs.forEach((b, i) => { b._i = i; });
  for (const b of bs) {
    if (GATED.has(b.t)) {
      if (!st.tudo && g >= st.rev) break;
      if (st.novo && g === st.rev - 1) { animar = b; ultimo = b._i; }
      g++;
    }
    html += '<div class="bloco' + (ultimo === b._i || (animar && b._i > ultimo) ? ' novo-bloco' : '') + '" data-b="' + b._i + '">' + bloco(b, p) + '</div>';
  }
  stageIn.innerHTML = html;
  if (animar && animar.t === 'term') digita(stageIn.querySelector('[data-b="' + animar._i + '"] pre'), animar, tok);
  if (st.novo && ultimo >= 0) {
    const el = stageIn.querySelector('[data-b="' + ultimo + '"]');
    if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  st.novo = false;
}

function bloco(b, p) {
  switch (b.t) {
    case 'intro': return '<div class="intro">' + md(b.linhas) + '</div>';
    case 'nota': {
      const k = b.args[0] || 'conceito';
      const rot = { regra: 'Regra do método', conceito: 'Conceito', dica: 'Como usar', atencao: 'Atenção', perfil: 'Perfil ' + st.perfil }[k] || k;
      return '<div class="nota ' + esc(k) + '"><div class="rotulo">' + esc(rot) + '</div><div class="md">' + md(b.linhas) + '</div></div>';
    }
    case 'chat': {
      const msgs = [];
      for (const l of b.linhas) {
        const m = l.match(/^@([^:]+):\s?(.*)$/);
        if (m) msgs.push({ de: m[1].trim(), txt: [m[2]] }); else if (msgs.length) msgs[msgs.length - 1].txt.push(l);
      }
      return '<div class="chat">' + msgs.map((m) => {
        const tipo = m.de === 'Claude' ? 'claude' : /^hook/.test(m.de) ? 'hook' : 'gente';
        const av = tipo === 'claude' ? 'C' : tipo === 'hook' ? 'F' + (m.de.match(/F\d/) || ['F'])[0].slice(1) : m.de.slice(0, 1);
        const corpo = tipo === 'hook' ? esc(m.txt.join('\n')) : inline(m.txt.join(' ')).replace(/^(\[[^\]]+\])/, '<span class="estado-tag">$1</span>');
        return '<div class="msg ' + tipo + '"><div class="av" aria-hidden="true">' + esc(av) + '</div><div><div class="quem-m">' + esc(m.de) + '</div><div class="txt">' + corpo + '</div></div></div>';
      }).join('') + '</div>';
    }
    case 'ticket': {
      const [chave, titulo, ferr] = b.args;
      const desc = b.linhas.filter((l) => !/^CA-\d+ \|/.test(l)).join(' ');
      const cas = b.linhas.filter((l) => /^CA-\d+ \|/.test(l)).map((l) => { const i = l.indexOf(' | '); return '<li><b>' + esc(l.slice(0, i)) + '</b><span>' + inline(l.slice(i + 3)) + '</span></li>'; }).join('');
      return '<div class="ticket"><div class="ticket-cab"><span class="chave">' + esc(chave) + '</span><span>História</span><span class="ferr">' + esc(ferr || '') + '</span></div><div class="ticket-corpo"><h3>' + esc(titulo) + '</h3><div class="desc">' + inline(desc) + '</div><ul class="cas">' + cas + '</ul></div></div>';
    }
    case 'file': {
      const [path, rot] = b.args;
      const longo = b.linhas.length > 26;
      return '<div class="arquivo"><div class="arq-cab"><button class="path" data-arq="' + esc(path) + '">' + esc(path) + '</button><span class="badge ' + esc((rot || '').split(' ')[0]) + '">' + esc(rot || 'trecho') + '</span></div><pre class="codigo">' + codigoHTML(b.linhas, 'arq') + '</pre>' + (longo ? '<button class="ver-tudo" data-expande>ver o trecho inteiro</button>' : '') + '</div>';
    }
    case 'term': {
      const segs = segmentos(b);
      const res = resultado(segs);
      const c = CAMADAS.find((x) => x[0] === b.args[1]);
      return '<div class="term"><div class="term-cab"><span class="via">' + esc(b.args[0] || '') + '</span>' + (c ? '<span>· ' + esc(c[1]) + '</span>' : '') + '<span class="res ' + res + '">' + RES_TXT[res] + '</span></div><pre>' + termHTML(segs) + '</pre></div>';
    }
    case 'fix': {
      const txt = [];
      const diff = [];
      let emDiff = false;
      for (const l of b.linhas) { if (l.startsWith('@ ')) emDiff = true; (emDiff ? diff : txt).push(l); }
      return '<div class="fix"><div class="fix-cab">✎ ' + inline(b.args[0] || 'Correção') + '</div>' + (txt.length ? '<div class="fix-txt md">' + md(txt) + '</div>' : '') + (diff.length ? '<pre class="codigo">' + codigoHTML(diff, 'diff') + '</pre>' : '') + '</div>';
    }
    case 'menu': return menuHTML();
    default: return '';
  }
}

function termHTML(segs) {
  return segs.map((s) => (s.cmd ? '<span class="t-cmd">' + esc(s.cmd) + '</span>\n' : '') + s.out.map((o) => { const c = corLinha(o); return c ? '<span class="' + c + '">' + esc(o) + '</span>' : esc(o); }).join('\n')).join('\n\n');
}

function digita(pre, b, tok) {
  if (!pre) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const segs = segmentos(b);
  const passos = [];
  segs.forEach((s, si) => {
    if (s.cmd) passos.push({ cmd: s.cmd, si });
    s.out.forEach((o, oi) => passos.push({ out: o, si, oi }));
  });
  const final = pre.innerHTML;
  let html = '';
  let k = 0;
  let segAtual = -1;
  const tick = () => {
    if (tok !== st.token) return;
    if (k >= passos.length) { pre.innerHTML = final; return; }
    const it = passos[k];
    if (it.si !== segAtual) { if (segAtual >= 0) html += '\n\n'; segAtual = it.si; }
    if (it.cmd !== undefined) {
      let c = 0;
      const tecla = () => {
        if (tok !== st.token) return;
        c = Math.min(it.cmd.length, c + 3);
        pre.innerHTML = html + '<span class="t-cmd">' + esc(it.cmd.slice(0, c)) + '</span><span class="cursor"></span>';
        if (c < it.cmd.length) setTimeout(tecla, 14);
        else { html += '<span class="t-cmd">' + esc(it.cmd) + '</span>\n'; k++; setTimeout(tick, 220); }
      };
      tecla();
      return;
    }
    const cl = corLinha(it.out);
    html += (it.oi > 0 ? '\n' : '') + (cl ? '<span class="' + cl + '">' + esc(it.out) + '</span>' : esc(it.out));
    pre.innerHTML = html + '<span class="cursor"></span>';
    k++;
    setTimeout(tick, 34);
  };
  tick();
}

function menuHTML() {
  const usadas = MENU_USADAS[st.perfil];
  return '<div class="menu-g">' + MENU.map(([g, ops]) => '<section><h4>' + esc(g) + '</h4><ul>' + ops.map(([cod, nome, so]) => {
    const oculta = (so === 'c' && st.perfil === 'requisitos') || (so === 'r' && st.perfil === 'completo');
    return '<li class="' + (oculta ? 'oculta' : '') + (usadas.includes(cod) && !oculta ? ' usada' : '') + '"><b>' + esc(cod) + '</b><span>' + esc(nome) + '</span></li>';
  }).join('') + '</ul></section>').join('') + '</div><div class="menu-leg">Riscadas: fora do menu no perfil <code>' + esc(st.perfil) + '</code>. Grifadas: usadas neste simulador.</div>';
}

function descArquivo(path) {
  if (ARQ.has(path)) return ARQ.get(path);
  if (/^modules\/[^/]+\/README\.md$/.test(path)) return '**N1 — Major Feature Set.** O que o domínio faz e o que não faz, os Feature Sets com as siglas, regras transversais e integrações. Opções 1A (negócio) e 1B (técnico).';
  if (/^modules\/[^/]+\/[^/]+\/README\.md$/.test(path)) return '**N2 — Feature Set.** A jornada (`## Fluxo Principal`), as features, as telas e as permissões por perfil. Integralmente negocial. Opção 2A.';
  if (/^modules\/.+\/f-[^/]+\.md$/.test(path)) return '**N3 — Feature.** Campos, regras de negócio, cenários Gherkin e comportamento de tela. O front-matter carrega a esteira (`estado` + `gates`) e a pendência de contagem. Opções 3A/3B, 4A/4B e CT.';
  if (/^analise-impacto\/AIM-SP/.test(path)) return '**AIM da sprint.** Consolida os tickets entregues, conta cada função uma vez e traz o apurável que a equipe de métricas audita.';
  if (/^analise-impacto\/AIM-/.test(path)) return '**AIM do ticket.** O que o ticket pede, o changeset que a PO avaliza e, no fechamento, o que mudou, com PFB/PFL e a reconciliação. Opção AIM; o fechamento é da skill analise-impacto.';
  if (/^qa\//.test(path)) return 'Plano de testes da feature: converte os Cenários do N3 em roteiro E2E. Artefato do CP3 (opção 5B).';
  if (/^global\/data-models\//.test(path)) return st.perfil === 'requisitos'
    ? 'Fragmento **negocial** do data-model do domínio: entidades, atributos em Label PO e relacionamentos, sem camada física. Opção DM; aprovado no CP2.'
    : 'Fragmento do data-model do domínio: entidades com Label PO, Label Dev, campo banco e tipo, e os ALI do domínio. Passada técnica (3B); aprovado no CP2.';
  return 'Arquivo da instância.';
}

function renderInst(lista) {
  const E = estadoAte(lista, st.idx);
  const vis = [...E.arq.entries()].filter(([, v]) => !v.oculto).map(([k]) => k).sort((a, b) => {
    const da = a.includes('/') ? 0 : 1;
    const db = b.includes('/') ? 0 : 1;
    return da - db || a.localeCompare(b);
  });
  const raiz = { d: new Map(), f: [] };
  for (const path of vis) {
    const partes = path.replace(/\/$/, '').split('/');
    const pasta = path.endsWith('/');
    let n = raiz;
    for (let i = 0; i < partes.length - 1; i++) { if (!n.d.has(partes[i])) n.d.set(partes[i], { d: new Map(), f: [] }); n = n.d.get(partes[i]); }
    n.f.push({ path, nome: partes[partes.length - 1] + (pasta ? '/' : '') });
  }
  const temMud = (n) => n.f.some((f) => E.mud.has(f.path)) || [...n.d.values()].some(temMud);
  const fechadas = st.fechadas || (st.fechadas = new Set(['.github', '.claude', 'prototypes', 'repos', 'modules/_base-conhecimento']));
  const arv = (n, pre) => [...n.d.entries()].map(([nome, sub]) => {
    const full = pre + nome;
    const aberto = !fechadas.has(full) || temMud(sub);
    return '<details data-pasta="' + esc(full) + '"' + (aberto ? ' open' : '') + '><summary>' + esc(nome) + '/</summary>' + arv(sub, full + '/') + '</details>';
  }).join('') + n.f.map((f) => {
    const m = E.mud.get(f.path) || '';
    return '<button class="f ' + m + '" data-arq="' + esc(f.path) + '" title="' + esc(f.path) + '"><span class="nm">' + esc(f.nome) + '</span><span class="pt"></span></button>';
  }).join('');

  const gates = GATES[st.perfil];
  const nOk = (e) => ({ 'rascunho': 0, 'requisitos-aprovados': 1, 'modelo-validado': 2, 'especificado': st.perfil === 'requisitos' ? 2 : 3, 'em-desenvolvimento': 3, 'implementado': 4, 'revisao-necessaria': 4 }[e] ?? 0);
  const feats = [...E.feats.values()].map((f) => {
    const [ic, rot] = ESTADOS[f.estado] || ['·', f.estado];
    const n = nOk(f.estado);
    const g = f.estado === 'a-especificar' || f.estado === 'revertida' ? '' : '<div class="gates">' + gates.map((c, i) => '<span class="' + (i < n ? (f.estado === 'revisao-necessaria' ? 'alerta' : 'ok') : '') + '">' + c + '</span>').join('') + '</div>';
    return '<div class="feat' + (E.fm.has(f.id) ? ' mudou' : '') + (f.estado === 'revertida' ? ' removida' : '') + '"><div class="l1"><span class="id">' + esc(f.id) + '</span><span class="est">' + ic + ' ' + esc(rot) + '</span></div><div class="nm2">' + esc(f.nome) + '</div>' + g + '</div>';
  }).join('');
  const aims = [...E.aims.values()].map((a) => {
    const sprint = /^SP/.test(a.id);
    const etapas = sprint ? ['rascunho', 'concluído'] : AIM_TICKET;
    const n = a.estado === 'revertida' ? 0 : etapas.indexOf(a.estado) + 1;
    return '<div class="aim' + (E.am.has(a.id) ? ' mudou' : '') + (a.estado === 'revertida' ? ' revertida' : '') + '"><div class="l1"><span class="id">AIM-' + esc(a.id) + '</span><span>' + esc(a.estado === 'revertida' ? 'revertida → SP08' : a.estado) + '</span></div><div class="trilha" aria-hidden="true">' + etapas.map((_, i) => '<i class="' + (i < n ? 'ok' : '') + '"></i>').join('') + '</div></div>';
  }).join('');
  const commits = E.commits.slice(-7).reverse().map((c) => '<li class="' + (c.novo ? 'novo' : '') + (c.rev ? ' rev' : '') + '">' + esc(c.msg) + '</li>').join('');

  $('#inst').innerHTML =
    '<h2>Instância loja-doc <small>ao fim do passo</small></h2><div class="ficha"><div><span>branch</span><span class="branch">' + esc(E.branch) + '</span></div><div><span>perfil</span><code>' + esc(st.perfil) + '</code></div><div><span>cadência</span><code>sprint</code></div></div>' +
    '<h2>Arquivos <small>clique para ver</small></h2>' + (vis.length ? '<div class="arvore">' + arv(raiz, '') + '</div>' : '<div class="vazio">repositório vazio</div>') +
    '<h2>Esteira por feature <small>' + gates.join(' → ') + '</small></h2>' + (feats ? '<div class="feats">' + feats + '</div>' : '<div class="vazio">nenhuma feature ainda</div>') +
    '<h2>AIMs</h2>' + (aims ? '<div class="aims">' + aims + '</div>' : '<div class="vazio">nenhuma AIM ainda</div>') +
    '<h2>Commits <small>mais recentes</small></h2>' + (commits ? '<ul class="commits">' + commits + '</ul>' : '<div class="vazio">nenhum commit ainda</div>');
  st.ultimoE = E;
}

function proximoGate(p) {
  if (st.tudo) return null;
  let g = 0;
  for (const b of blocos(p)) if (GATED.has(b.t)) { if (g >= st.rev) return b; g++; }
  return null;
}
function renderCtl(p, lista) {
  const g = proximoGate(p);
  const bp = $('#b-prox');
  if (g) {
    if (g.t === 'term') {
      const seg = segmentos(g)[0];
      bp.innerHTML = '<span class="ico">▶</span>Rodar ' + esc(seg && seg.cmd ? seg.cmd.replace(/^(node|python3?)\s+/, '') : (g.args[0] || ''));
    } else bp.innerHTML = '<span class="ico">✎</span>' + inline(g.args[0] || 'Aplicar a correção');
    bp.disabled = false;
  } else if (st.idx < lista.length - 1) { bp.innerHTML = 'Próximo passo: ' + inline(meta(lista[st.idx + 1], 'titulo')) + ' ›'; bp.disabled = false; }
  else { bp.textContent = 'Fim do simulador'; bp.disabled = true; }
  bp.title = bp.textContent;
  $('#b-ant').disabled = st.idx === 0;
  $('#prog-t').textContent = 'Passo ' + (st.idx + 1) + ' de ' + lista.length + ' · ' + CAPS[p.meta.cap];
  $('#prog-b').style.width = (100 * (st.idx + 1) / lista.length) + '%';
  $('#c-tudo').checked = st.tudo;
}

/* ── Sobreposições: mapa e arquivo ──────────────────────────────────── */
function abrir(id) { const o = document.getElementById(id); o.hidden = false; const f = o.querySelector('[data-fecha]'); if (f) f.focus(); }
function fechar() { document.querySelectorAll('.ov').forEach((o) => { o.hidden = true; }); }

function abrirArquivo(path) {
  const E = st.ultimoE || estadoAte(passos(), st.idx);
  const c = E.corpo.get(path);
  $('#ov-arq-t').textContent = path;
  let html = '<div class="arq-desc md">' + md([descArquivo(path)]) + '</div>';
  if (c) {
    const i = passos().indexOf(c.passo);
    html += '<div class="arq-meta">Último trecho mostrado no passo ' + (i + 1) + ', <button class="lnk" data-ir="' + i + '">' + inline(meta(c.passo, 'titulo')) + '</button>' +
      (c.corrigido ? ', já com as correções aplicadas (em destaque).' : '.') +
      (c.defasado ? ' O passo ' + (passos().indexOf(c.defasado) + 1) + ' corrige este arquivo de um jeito que o trecho não mostra; a correção está no próprio passo.' : '') + '</div>';
    html += '<div class="arquivo"><pre class="codigo inteiro">' + codigoHTML(c.linhas, 'arq') + '</pre></div>';
  } else html += '<div class="arq-meta">Modelo semeado pelo <code>init-instance</code>, em branco até um passo o preencher.</div>';
  $('#ov-arq-c').innerHTML = html;
  abrir('ov-arq');
}

function renderMapa() {
  const lista = passos();
  ['proc', 'val', 'arq'].forEach((a) => $('#a-' + a).setAttribute('aria-selected', String(st.aba === a)));
  const ocorr = [];
  lista.forEach((p, i) => blocos(p).forEach((b) => { if (b.t === 'term') segmentos(b).forEach((s) => { if (s.script && s.script !== 'git') ocorr.push({ i, p, camada: b.args[1], fase: meta(p, 'fase'), script: s.script, res: s.res }); }); }));
  const mk = (r) => r === 'erro' ? '<span class="mk-err">✗</span>' : r === 'aviso' ? '<span class="mk-warn">⚠</span>' : '<span class="mk-ok">✓</span>';
  let html = '';
  if (st.aba === 'proc') {
    const faseAtual = meta(lista[st.idx], 'fase');
    html += '<div class="md" style="max-width:80ch"><p>Cada célula junta o que roda numa camada de validação durante uma fase. Clique num script para ir ao primeiro passo em que ele aparece ali; ✗ marca onde o simulador mostra uma reprovação.</p></div>';
    html += '<div class="mapa"><table><thead><tr><th></th>' + FASES.map((f) => '<th>' + esc(f[1]) + '</th>').join('') + '</tr></thead><tbody>';
    for (const [ck, cn, cd] of CAMADAS) {
      html += '<tr><td class="faixa">' + esc(cn) + '<small>' + esc(cd) + '</small></td>';
      for (const [fk] of FASES) {
        const aqui = ocorr.filter((o) => o.camada === ck && o.fase === fk);
        const por = new Map();
        aqui.forEach((o) => { if (!por.has(o.script)) por.set(o.script, []); por.get(o.script).push(o); });
        html += '<td class="' + (fk === faseAtual ? 'atual' : '') + '">' + [...por].map(([sc, os]) => '<button class="sc" data-ir="' + os[0].i + '">' + esc(sc.replace(/\.(mjs|py)$/, '')) + ' ' + [...new Set(os.map((o) => o.res))].map(mk).join('') + '<span class="r">passo ' + [...new Set(os.map((o) => o.i + 1))].join(', ') + '</span></button>').join('') + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
  } else if (st.aba === 'val') {
    html += '<div class="tab-wrap"><table><thead><tr><th>Script</th><th>Quando roda</th><th>O que confere</th><th>Onde aparece</th></tr></thead><tbody>';
    for (const [nome, d] of SCR) {
      const os = ocorr.filter((o) => o.script === nome);
      const onde = [...new Map(os.map((o) => [o.i, o])).values()].map((o) => '<button class="lnk" data-ir="' + o.i + '">' + (o.i + 1) + '</button>' + mk(os.filter((x) => x.i === o.i).some((x) => x.res === 'erro') ? 'erro' : o.res)).join(' · ');
      html += '<tr><td><code>' + esc(nome) + '</code></td><td>' + esc(d.onde) + '</td><td>' + inline(d.faz) + '</td><td>' + (onde || '<span class="vazio">não aparece neste perfil</span>') + '</td></tr>';
    }
    html += '</tbody></table></div>';
  } else {
    const grupos = [['Raiz e automação', (p) => !p.includes('/') || /^\.(claude|github)\//.test(p)], ['Arquivos globais (global/)', (p) => p.startsWith('global/')], ['Níveis e espelhos (modules/)', (p) => p.startsWith('modules/')], ['Análise de impacto, testes, código e protótipos', (p) => /^(analise-impacto|qa|repos|prototypes)\//.test(p)], ['Sincronizados do engine', (p) => /^(engine|scripts)\/$/.test(p)]];
    for (const [g, f] of grupos) {
      html += '<h3 style="font-size:15px">' + esc(g) + '</h3><div class="tab-wrap"><table><tbody>' + [...ARQ.keys()].filter(f).map((p) => '<tr><td style="width:36%"><code>' + esc(p) + '</code></td><td>' + inline(ARQ.get(p)) + '</td></tr>').join('') + '</tbody></table></div>';
    }
  }
  $('#ov-mapa-c').innerHTML = html;
}

/* ── Navegação ──────────────────────────────────────────────────────── */
function ir(i) { st.idx = i; st.rev = 0; st.novo = false; fechar(); render(); window.scrollTo(0, 0); $('#roteiro').classList.remove('aberto'); }
function avancar() {
  const lista = passos();
  const p = lista[st.idx];
  if (proximoGate(p)) { st.rev++; st.novo = true; render(); return; }
  if (st.idx < lista.length - 1) ir(st.idx + 1);
}
function voltar() { if (st.idx > 0) { st.idx--; st.rev = Infinity; st.novo = false; render(); window.scrollTo(0, 0); } }
function trocaPerfil(pf) {
  if (pf === st.perfil) return;
  const atual = passos()[st.idx];
  st.perfil = pf;
  try { localStorage.setItem('docqui-sim-perfil', pf); } catch (e) { /* sem storage */ }
  const lista = passos();
  let i = lista.indexOf(atual);
  if (i < 0) { const pos = TODOS.indexOf(atual); i = lista.findIndex((p) => TODOS.indexOf(p) > pos); if (i < 0) i = lista.length - 1; }
  st.idx = i; st.rev = 0;
  $('#p-completo').setAttribute('aria-pressed', String(pf === 'completo'));
  $('#p-requisitos').setAttribute('aria-pressed', String(pf === 'requisitos'));
  render();
  if (!$('#ov-mapa').hidden) renderMapa();
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-ir],[data-arq],[data-fecha],[data-expande]');
  if (!t) { if (ev.target.classList && ev.target.classList.contains('ov')) fechar(); return; }
  if (t.hasAttribute('data-ir')) ir(+t.getAttribute('data-ir'));
  else if (t.hasAttribute('data-arq')) abrirArquivo(t.getAttribute('data-arq'));
  else if (t.hasAttribute('data-fecha')) fechar();
  else if (t.hasAttribute('data-expande')) { const pre = t.previousElementSibling; pre.classList.toggle('inteiro'); t.textContent = pre.classList.contains('inteiro') ? 'recolher' : 'ver o trecho inteiro'; }
});
document.addEventListener('toggle', (ev) => {
  const d = ev.target;
  if (!d.matches || !d.matches('details[data-pasta]')) return;
  const k = d.getAttribute('data-pasta');
  if (d.open) st.fechadas.delete(k); else st.fechadas.add(k);
}, true);
$('#b-prox').addEventListener('click', avancar);
$('#b-ant').addEventListener('click', voltar);
$('#p-completo').addEventListener('click', () => trocaPerfil('completo'));
$('#p-requisitos').addEventListener('click', () => trocaPerfil('requisitos'));
$('#c-tudo').addEventListener('change', (e) => { st.tudo = e.target.checked; try { localStorage.setItem('docqui-sim-tudo', st.tudo ? '1' : '0'); } catch (x) { /* sem storage */ } render(); });
$('#b-mapa').addEventListener('click', () => { renderMapa(); abrir('ov-mapa'); });
['proc', 'val', 'arq'].forEach((a) => $('#a-' + a).addEventListener('click', () => { st.aba = a; renderMapa(); }));
$('#b-rot').addEventListener('click', () => { const r = $('#roteiro'); r.classList.toggle('aberto'); $('#b-rot').setAttribute('aria-expanded', String(r.classList.contains('aberto'))); });

/* As gavetas começam onde o topo termina — em tela estreita ele quebra em mais de uma
   linha, e a altura fixa (--top-h) as poria por cima dos botões que as fecham. */
new ResizeObserver(() => document.documentElement.style.setProperty('--top-real', $('.top').getBoundingClientRect().height + 'px')).observe($('.top'));

/* ── Painel da instância: gaveta sobreposta, recolhida por padrão ──── */
function painelInst(aberto) {
  $('#inst').classList.toggle('aberto', aberto);
  $('#b-inst').setAttribute('aria-expanded', String(aberto));
  try { localStorage.setItem('docqui-sim-inst', aberto ? '1' : '0'); } catch (e) { /* sem storage */ }
}
$('#b-inst').addEventListener('click', () => painelInst(!$('#inst').classList.contains('aberto')));
try { if (localStorage.getItem('docqui-sim-inst') === '1') painelInst(true); } catch (e) { /* sem storage */ }

/* ── Roteiro com largura ajustável (arraste a alça; ← → com foco nela) ── */
const ROT_PADRAO = 268;
let rotW = ROT_PADRAO;
function larguraRot(w) {
  rotW = Math.round(Math.min(560, Math.max(200, w)));
  $('.cols').style.setProperty('--rot-w', rotW + 'px');
  $('#alca').setAttribute('aria-valuenow', String(rotW));
}
const guardaRot = () => { try { localStorage.setItem('docqui-sim-rot-w', String(rotW)); } catch (e) { /* sem storage */ } };
try { const w = parseInt(localStorage.getItem('docqui-sim-rot-w'), 10); if (w) larguraRot(w); } catch (e) { /* sem storage */ }
$('#alca').addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  const alca = ev.currentTarget;
  const x0 = $('.cols').getBoundingClientRect().left;
  alca.setPointerCapture(ev.pointerId);
  alca.classList.add('arrastando');
  document.body.classList.add('arrastando-rot');
  const mover = (e) => larguraRot(e.clientX - x0);
  const soltar = () => {
    alca.removeEventListener('pointermove', mover);
    alca.removeEventListener('pointerup', soltar);
    alca.removeEventListener('pointercancel', soltar);
    alca.classList.remove('arrastando');
    document.body.classList.remove('arrastando-rot');
    guardaRot();
  };
  alca.addEventListener('pointermove', mover);
  alca.addEventListener('pointerup', soltar);
  alca.addEventListener('pointercancel', soltar);
});
$('#alca').addEventListener('keydown', (ev) => {
  const d = { ArrowLeft: -16, ArrowRight: 16 }[ev.key];
  if (!d) return;
  ev.preventDefault();
  ev.stopPropagation();  // as setas, fora da alça, trocam de passo
  larguraRot(rotW + d);
  guardaRot();
});
$('#alca').addEventListener('dblclick', () => { larguraRot(ROT_PADRAO); guardaRot(); });
$('#b-tema').addEventListener('click', () => {
  const root = document.documentElement;
  const escuro = root.getAttribute('data-theme') ? root.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', escuro ? 'light' : 'dark');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { fechar(); return; }
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (!document.querySelectorAll('.ov:not([hidden])').length) {
    if (e.key === 'ArrowRight') { e.preventDefault(); avancar(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); voltar(); }
  }
});

/* ── Início ─────────────────────────────────────────────────────────── */
$('#p-completo').setAttribute('aria-pressed', String(st.perfil === 'completo'));
$('#p-requisitos').setAttribute('aria-pressed', String(st.perfil === 'requisitos'));
function porAncora() {
  const ancora = (location.hash || '').slice(1);
  const i = ancora ? passos().findIndex((p) => p.id === ancora) : -1;
  return i;
}
window.addEventListener('hashchange', () => { const i = porAncora(); if (i >= 0 && i !== st.idx) ir(i); });
const inicial = porAncora();
if (inicial >= 0) st.idx = inicial;
render();
})();
</script>
</body>
</html>
