        const usuario = { requisitos: 'ana.po', 'modelo-dados': 'bru.dba', testes: 'lia.qa', codigo: 'caio.tl' }[cena.gate];
        const linhas = ['- estado: ' + anterior, '+ estado: ' + novo,
          '+ ' + cena.gate + ': { aprovado: true, por: "' + usuario + '", em: 2026-10-08, pr: ' + cena.numero + ' }'];
        if (cena.id === 'cp1') linhas.push(corrigido
          ? '  modelo-dados: { aprovado: false, por: "", em: "", pr: "" }'
          : '+ modelo-dados: { aprovado: true, por: "", em: "", pr: "" }');
        return linhas;
      }
      return ['  ## Implementação', '+ | implementação entregue | loja-api | src/checkout | main |'];
    }
    if (path.startsWith('qa/')) {
      const id = path.includes('resumo') ? 'VND-CHK-02' : 'VND-CHK-01';
      return ['+ # Plano de testes — ' + id + ' — ' + (path.includes('resumo') ? 'Consultar Resumo do Pedido' : 'Calcular Frete'),
        '+ ## Massa de teste', '+ ## Cobertura das regras', '+ | ' + id + '/RN-01 | cenário @RN-01 do N3 | `' + id + '/RN-01 — …` |',
        '+ ## 📐 NFR aplicáveis', '+ ## Pontos a resolver (❓)'];
    }
    if (path.startsWith('src/test/')) {
      const testes = { 'codigo1': ['VND-CHK-01/RN-01 — frete da faixa do CEP', 'VND-CHK-01/RN-02 — CEP fora das faixas', 'VND-CHK-01/RN-03 — CEP com menos de 8 dígitos'] }[cena.id]
        || (path.includes('pedido') ? ['VND-CHK-02/RN-01 — prazo prometido no resumo'] : ['VND-CHK-01/RN-04 — prazo da faixa do CEP']);
      return testes.map(n => '+ @Test @DisplayName("' + n + '")');
    }
    if (path === 'repos/INDEX.md') return ['+ | loja-api | https://git.acme/loja-api | Vendas | domínio | API do checkout | Java | Caio |'];
    if (path.startsWith('src/')) return ['+ // Funcionalidade e ticket identificados no commit e no PR', '+ // ' + cena.ticket + ': implementação do comportamento especificado', '+ // Trecho didático; não é código executável da Loja Acme.'];
    if (cena.gate && (path === INDEX || path.startsWith('analise-impacto/'))) {
      const resumo = cena.arquivos.includes(RESUMO);
      const feature = resumo ? 'VND-CHK-02: Consultar Resumo do Pedido' : 'VND-CHK-01: Calcular Frete';
      const spec = (resumo ? RESUMO : FRETE).slice('modules/'.length);
      const aim = resumo ? AIM2 : AIM1;
      const linha = valor => path === INDEX
        ? '| [`' + cena.ticket + '`](../' + aim + ') | [' + feature + '](./' + spec + ') | Vendas | ' + status(valor) + ' | 📋 | — | — | — |'
        : '| [`' + feature + '`](../modules/' + spec + ') | Vendas · Checkout | Criação | `CA-1, CA-2, CA-3` | ' + status(valor) + ' |';
      const espelho = valor => '| `' + feature.split(':')[0] + '` ([spec](./' + spec + ')) | ' + cena.ticket + ' | ' + valor + ' |';
      const defasado = cena.id === 'cp1' && !corrigido;
      return (path === INDEX ? ['  ## Esteira de checkpoints', ...(defasado
        ? ['  ' + espelho(anterior)] : ['- ' + espelho(anterior), '+ ' + espelho(novo)])] : [])
        .concat(['  ## ' + (path === INDEX ? 'Rastreabilidade' : 'Funcionalidades')], defasado
          ? ['  ' + linha(anterior)] : ['- ' + linha(anterior), '+ ' + linha(novo)]);
    }
    if (path.startsWith('analise-impacto/')) return cena.entrega ? ['- estado: em-execução', '+ estado: concluído', '+ Entrega reconciliada com as funcionalidades no estado final.'] : ['+ Ticket: ' + cena.ticket, '+ Status das funcionalidades espelhado do N3; changeset e critérios de aceite conferidos.'];
    return ['+ ' + (path === INDEX ? 'Espelho da esteira e Status de rastreabilidade atualizados no mesmo PR.' : 'Artefato do checkpoint incluído e revisado.')];
  }

  function ausente(path, corrigido) {
    return !corrigido && ((cena.id === 'cp3' && path.startsWith('qa/')) || (cena.id === 'cp4' && path === 'repos/INDEX.md'));
  }

  function diffCorrecao(path) {
    const conteudo = corrigido => ausente(path, corrigido) ? []
      : diff(path, corrigido).filter(l => !l.startsWith('-')).map(l => l.slice(2));
    const antes = conteudo(false), depois = conteudo(true);
    let inicio = 0, fimAntes = antes.length, fimDepois = depois.length;
    while (inicio < fimAntes && inicio < fimDepois && antes[inicio] === depois[inicio]) inicio++;
    if (inicio === fimAntes && inicio === fimDepois) return [];
    while (fimAntes > inicio && fimDepois > inicio && antes[fimAntes - 1] === depois[fimDepois - 1]) { fimAntes--; fimDepois--; }
    const removidas = antes.slice(inicio, fimAntes), adicionadas = depois.slice(inicio, fimDepois);
    const comuns = Array.from({ length: removidas.length + 1 }, () => Array(adicionadas.length + 1).fill(0));
    for (let i = removidas.length - 1; i >= 0; i--) {
      for (let j = adicionadas.length - 1; j >= 0; j--) {
        comuns[i][j] = removidas[i] === adicionadas[j] ? 1 + comuns[i + 1][j + 1] : Math.max(comuns[i + 1][j], comuns[i][j + 1]);
      }
    }
    const linhas = [];
    let i = 0, j = 0;
    while (i < removidas.length || j < adicionadas.length) {
      if (i < removidas.length && j < adicionadas.length && removidas[i] === adicionadas[j]) { linhas.push('  ' + removidas[i++]); j++; }
      else if (i < removidas.length && (j === adicionadas.length || comuns[i + 1][j] >= comuns[i][j + 1])) linhas.push('- ' + removidas[i++]);
      else linhas.push('+ ' + adicionadas[j++]);
    }
    return antes.slice(Math.max(0, inicio - 2), inicio).map(l => '  ' + l)
      .concat(linhas, depois.slice(fimDepois, fimDepois + 2).map(l => '  ' + l));
  }

  function arquivos() {
    const correcao = estado.corrigido && estado.comparacao === 'correcao';
    const html = cena.arquivos.map(path => {
      const falta = ausente(path, estado.corrigido);
      const linhas = correcao ? diffCorrecao(path) : diff(path, estado.corrigido);
      if (correcao && !linhas.length) return '';
      return '<section class="gh-file"><div class="gh-panel-head">' + esc(path) +
        (falta ? ' <span class="gh-error">— ausente do PR</span>' : correcao && ausente(path, false) ? ' — incluído pela correção' : '') + '</div>' +
        (falta ? '<div class="gh-panel-body">O artefato precisa estar no diff, não apenas em outro PR.</div>'
          : '<pre class="gh-diff">' + linhas.map(l => '<span class="' + (l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : '') + '">' + esc(l) + '</span>').join('') + '</pre>') + '</section>';
    }).join('');
    return '<div class="gh-guide">Diff didático resumido, não um patch completo ou uma captura do GitHub real. ' +
      (correcao ? 'Comparação: antes → depois do commit de correção. Vermelho: removido; verde: adicionado. Só os arquivos alterados pela correção aparecem.'
        : 'Comparação: branch base → versão atual do PR. Os demais gates permanecem como já estavam na base.') + '</div>' +
      (estado.corrigido ? '<div class="gh-picker"><label for="gh-diff-view">Comparação do diff</label><select id="gh-diff-view"><option value="pr"' + (!correcao ? ' selected' : '') + '>PR completo (base → atual)</option><option value="correcao"' + (correcao ? ' selected' : '') + '>Commit de correção (antes → depois)</option></select></div>' : '') +
      (html || '<div class="gh-guide">Não há novas alterações nos trechos didáticos desta cena. O pedido de revisão não fornece um diff adicional.</div>');
  }

  function review() {
    return '<section class="gh-panel"><div class="gh-panel-head">Review changes — ' + esc(cena.revisor) + '</div><form class="gh-panel-body gh-form" data-gh-form="review">' +
      '<p>Revisão humana do artefato pelo CODEOWNER; check verde não equivale a aprovação.</p>' +
      '<label for="gh-review-comment">Comentário de revisão (opcional)</label><textarea id="gh-review-comment" name="comment" placeholder="O que foi conferido no artefato?"></textarea>' +
      '<div class="gh-review-options"><label><input type="radio" name="review" value="comment" checked> Comment</label><label><input type="radio" name="review" value="changes"> Request changes</label><label><input type="radio" name="review" value="approved"> Approve</label></div>' +
      '<button class="gh-btn primary" type="submit"' + (cena.draft || estado.merged ? ' disabled' : '') + '>Submit review (simulado)</button></form></section>';
  }

  function conversa() {
    const aprovado = estado.review === 'approved';
    const pronto = estado.checks === 'success' && aprovado && !cena.draft;
    let html = '<section class="gh-panel"><div class="gh-panel-head">Rui abriu este pull request · ' + esc(cena.ticket) + '</div><div class="gh-panel-body"><p>' + esc(cena.descricao) + '</p><p><strong>Arquivos do PR:</strong> ' + cena.arquivos.length + ' · Perfil: ' + esc(perfil) + '</p></div></section>' + checks();
    html += '<section class="gh-panel"><div class="gh-panel-head">Reviewers</div><div class="gh-panel-body"><p>' + esc(cena.revisor) + ' · ' +
      (aprovado ? '<span class="gh-ok">✓ Approved</span>' : estado.review === 'changes' ? '<span class="gh-error">Changes requested</span>' : 'Review required') + '</p>' +
      (estado.comentario ? '<p><strong>Comentário:</strong> ' + esc(estado.comentario) + '</p>' : '') +
      (estado.review === 'changes' ? botao('fix', 'Enviar commit de correção (simulado)', estado.merged) : '') +
      '<div class="gh-actions">' + botao('review', 'Review changes', cena.draft || estado.merged) + '</div></div></section>';
    if (estado.merged) return html + '<section class="gh-panel"><div class="gh-panel-head gh-ok">Pull request successfully merged and closed</div><div class="gh-panel-body"><p>A branch <code>' + esc(cena.head) + '</code> foi mesclada em <code>' + esc(cena.base) + '</code> nesta simulação.</p><p>' +
      (cena.entrega ? 'A main passa a representar a sprint entregue. Confira o conteúdo e origin/main..origin/sprint/SP07 = 0.'
        : cena.base === 'main' ? 'Confira o conteúdo na main e a trilha Approved-by do merge.'
        : 'O checkpoint entra na branch da sprint; a main permanece inalterada até a entrega.') + '</p>' +
      (cena.base === 'main' && !cena.codigo ? '<p><span class="gh-ok">✓ check-approval-trailers</span> · conferência pós-merge: o Approved-by foi incluído na mensagem.</p>' : '') + '</div></section>';
    html += '<section class="gh-panel"><div class="gh-panel-head">' + (cena.draft ? 'This pull request is still a draft' : pronto ? 'Merging is available' : 'Merging is blocked') + '</div><div class="gh-panel-body"><p>' +
      (cena.draft ? 'O PR da sprint fica aberto como draft. A conclusão está na cena “Entrega”, depois do fechamento das AIMMs e da retirada do ticket não entregue.'
        : pronto ? 'Checks aprovados e revisão humana aprovada. Confirme a branch base antes do merge.'
        : 'É necessário passar nos checks, resolver os pedidos de alteração e receber aprovação do revisor.') + '</p>' +
      botao('merge', 'Merge pull request', !pronto, true);
    if (estado.confirmando) html += '<form class="gh-form" data-gh-form="merge"><label for="gh-merge-title">Commit title</label><input type="text" id="gh-merge-title" readonly value="Merge pull request #' + cena.numero + ' from acme/' + esc(cena.head) + '">' +
      '<label for="gh-merge-body">Commit message</label><textarea id="gh-merge-body" name="message"></textarea>' +
      (cena.base === 'main' ? '<p>Use Create a merge commit. No corpo, inclua <code>Approved-by: Nome &lt;email&gt;</code>; a aprovação da interface não escreve esse trailer automaticamente.</p>' + botao('trailer', 'Incluir Approved-by do aprovador') : '') +
      '<div class="gh-actions"><button type="submit" class="gh-btn primary">Confirm merge (simulado)</button>' + botao('cancel-merge', 'Cancel') + '</div></form>';
    return html + '</div></section>';
  }

  function render() {
    const tabs = [['conversation', 'Conversation'], ['commits', 'Commits'], ['checks', 'Checks'], ['files', 'Files changed']];
    let corpo;
    if (!estado.aberto) corpo = '<section class="gh-panel"><div class="gh-panel-head">Comparing changes</div><div class="gh-panel-body"><div class="gh-branches"><strong>base:</strong> <code>' + esc(cena.base) + '</code> ← <strong>compare:</strong> <code>' + esc(cena.head) + '</code></div><p>A branch de trabalho é criada a partir da base indicada, recebe os artefatos em um commit com a chave do ticket e é enviada com git push antes de abrir o PR.</p><form class="gh-form" data-gh-form="create"><label for="gh-pr-title">Título</label><input type="text" id="gh-pr-title" readonly value="' + esc(cena.titulo) + '"><label for="gh-pr-body">Descrição</label><textarea id="gh-pr-body" readonly>' + esc(cena.descricao) + '\nTicket: ' + esc(cena.ticket) + '</textarea><div class="gh-actions"><button type="submit" class="gh-btn primary">' + (cena.draft ? 'Create draft pull request' : 'Create pull request') + ' (simulado)</button></div></form></div></section>';
    else if (estado.aba === 'checks') corpo = checks();
    else if (estado.aba === 'files') corpo = arquivos() + review();
    else if (estado.aba === 'commits') corpo = '<section class="gh-panel"><div class="gh-panel-head">Commits da branch de trabalho</div><div class="gh-panel-body"><p><code>docs: ' + esc(cena.gate || cena.titulo) + ' (' + esc(cena.ticket) + ')</code></p>' + (estado.corrigido ? '<p><code>docs: correção após checks/review (' + esc(cena.ticket) + ')</code></p>' : '') + '<p>Uma chave de ticket por commit de spec; um gate por PR de checkpoint. Estes commits são apenas ilustrativos.</p></div></section>';
    else corpo = conversa();
    container.innerHTML = '<div class="gh"><div class="gh-banner"><strong>GitHub simulado — ambiente de ensino.</strong> Não acessa sua conta, não cria branches/PRs e não altera os gates ou arquivos do roteiro. Nomes, números e diffs são ilustrativos.</div>' +
      '<div class="gh-header"><div class="gh-repo">▣ acme / <strong>' + esc(cena.repo) + '</strong> <small>simulado</small></div><div class="gh-repo-nav"><span>Code</span><span>Issues</span><span class="active">Pull requests</span><span>Actions</span></div></div>' +
      '<div class="gh-shell"><div class="gh-picker"><label for="gh-scene">Cena do roteiro</label><select id="gh-scene">' + porPerfil(perfil).map(c => '<option value="' + c.id + '"' + (c.id === cena.id ? ' selected' : '') + '>' + esc(c.titulo) + ' — #' + c.numero + '</option>').join('') + '</select>' + botao('reset', 'Reiniciar cena') + '</div>' +
      '<h3 class="gh-title">' + esc(cena.titulo) + ' <span>#' + cena.numero + '</span></h3><div class="gh-meta"><span class="gh-status ' + (estado.merged ? 'merged' : cena.draft ? 'draft' : '') + '">' + (estado.merged ? '⑂ Merged' : cena.draft ? '○ Draft' : '⑂ ' + (estado.aberto ? 'Open' : 'Novo PR')) + '</span><span>Rui quer mesclar <code>' + esc(cena.head) + '</code> em <code>' + esc(cena.base) + '</code></span></div>' +
      (estado.aberto ? '<div class="gh-tabs" role="tablist" aria-label="Abas do pull request">' + tabs.map(([id, nome]) => '<button type="button" id="gh-tab-' + id + '" role="tab" data-gh-tab="' + id + '" aria-controls="gh-tabpanel" aria-selected="' + (estado.aba === id) + '" tabindex="' + (estado.aba === id ? '0' : '-1') + '">' + nome + '</button>').join('') + '</div>' : '') +
      '<div class="gh-layout"><div id="gh-tabpanel"' + (estado.aberto ? ' role="tabpanel" aria-labelledby="gh-tab-' + estado.aba + '"' : '') + '>' + corpo + '<div class="gh-notice" role="status" aria-live="polite" tabindex="-1">' + esc(estado.aviso) + '</div></div><aside class="gh-sidebar"><section><h3>Reviewers · CODEOWNERS</h3><p>' + esc(cena.revisor) + '</p><p>' + (estado.review === 'approved' ? '✓ Approved' : 'Revisão humana obrigatória') + '</p></section><section><h3>Branch base</h3><p><code>' + esc(cena.base) + '</code></p><p>' + (cena.base === 'main' ? 'Preparação, código ou entrega; não antecipar a spec da sprint.' : 'Checkpoint mesclado na sprint, não diretamente na main.') + '</p></section><section><h3>Ticket</h3><p>' + esc(cena.ticket) + '</p><h3>Labels</h3><p>documentação · ' + esc(perfil) + '</p></section></aside></div></div></div>';
  }

  function acao(nome) {
    estado.aviso = '';
    if (nome === 'reset') { mostrar(perfil, cena.id); return; }
    if (nome === 'correction' && estado.corrigido) {
      estado.aba = 'files'; estado.comparacao = 'correcao'; render();
      container.querySelector('#gh-diff-view').focus({ preventScroll: true });
      return;
    }
    if (!estado.aberto || estado.merged) return;
    if (nome === 'checks') {
      estado.checks = cena.draft || (cena.problema && !estado.corrigido) ? 'failure' : 'success';
      estado.aviso = estado.checks === 'failure' ? 'Checks reprovados; o merge continua bloqueado.' : 'Checks aprovados. Ainda é necessária a revisão humana.';
    } else if (nome === 'fix') {
      estado.corrigido = true; estado.comparacao = 'correcao'; estado.checks = 'pending'; estado.review = ''; estado.comentario = ''; estado.confirmando = false;
      estado.aviso = 'Commit de correção enviado na mesma branch. Veja o antes/depois em Files changed, reexecute os checks e solicite nova revisão.';
    } else if (nome === 'review') estado.aba = 'files';
    else if (nome === 'merge' && estado.checks === 'success' && estado.review === 'approved' && !cena.draft) estado.confirmando = true;
    else if (nome === 'cancel-merge') estado.confirmando = false;
    else if (nome === 'trailer') {
      container.querySelector('#gh-merge-body').value = 'Approved-by: ' + cena.aprovador;
      return;
    }
    render();
    container.querySelector('.gh-notice').focus({ preventScroll: true });
  }

  function iniciar(el, aoSelecionar) {
    container = el; selecionar = aoSelecionar;
    container.addEventListener('change', e => {
      if (e.target.id === 'gh-scene') selecionar(e.target.value);
      else if (e.target.id === 'gh-diff-view') { estado.comparacao = e.target.value; render(); container.querySelector('#gh-diff-view').focus({ preventScroll: true }); }
    });
    container.addEventListener('click', e => {
      const tab = e.target.closest('[data-gh-tab]');
      if (tab) { estado.aba = tab.dataset.ghTab; render(); container.querySelector('#gh-tab-' + estado.aba).focus(); return; }
      const btn = e.target.closest('[data-gh-action]');
      if (btn && !btn.disabled) acao(btn.dataset.ghAction);
    });
    container.addEventListener('keydown', e => {
      if (!e.target.matches('[data-gh-tab]')) return;
      const tabs = ['conversation', 'commits', 'checks', 'files'];
      const i = tabs.indexOf(estado.aba);
      const proxima = e.key === 'ArrowRight' ? tabs[(i + 1) % tabs.length] : e.key === 'ArrowLeft' ? tabs[(i + 3) % tabs.length] : e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[3] : null;
      if (!proxima) return;
      e.preventDefault(); e.stopPropagation();
      estado.aba = proxima; render(); container.querySelector('#gh-tab-' + proxima).focus();
    });
    container.addEventListener('submit', e => {
      const form = e.target.closest('[data-gh-form]');
      if (!form) return;
      e.preventDefault();
      const data = new FormData(form);
      if (form.dataset.ghForm === 'create') { estado.aberto = true; estado.aba = 'conversation'; }
      else if (form.dataset.ghForm === 'review') {
        if (cena.draft || estado.merged) return;
        const valor = data.get('review');
        if (valor === 'approved' && estado.checks !== 'success') { estado.aviso = 'Aprovação bloqueada nesta simulação: primeiro resolva e passe nos checks.'; }
        else {
          estado.review = valor; estado.comentario = String(data.get('comment') || ''); estado.confirmando = false; estado.aba = 'conversation';
          estado.aviso = valor === 'changes' ? 'Revisor solicitou alterações; envie um commit de correção e peça nova revisão.' : valor === 'approved' ? 'Revisão aprovada pelo CODEOWNER.' : 'Comentário registrado. Comment não é uma aprovação.';
        }
      } else if (form.dataset.ghForm === 'merge') {
        if (!estado.confirmando || estado.checks !== 'success' || estado.review !== 'approved' || cena.draft || estado.merged) return;
        if (cena.base === 'main' && !/^Approved-by:\s+.+\s<[^<>\s]+@[^<>\s]+>$/m.test(String(data.get('message') || ''))) {
          container.querySelector('.gh-notice').textContent = 'Merge não confirmado: inclua Approved-by: Nome <email> no corpo da mensagem.';
          return;
        }
        estado.merged = true; estado.confirmando = false; estado.aviso = 'Merge concluído apenas na simulação. Nenhuma operação foi enviada ao GitHub.';
      }
      render();
      container.querySelector('.gh-notice').focus({ preventScroll: true });
    });
  }
  window.DOCQUI_GITHUB = { cenas: porPerfil, mostrar, iniciar };
})();

</script>
<script>window.iniciarSimulador();</script>
</body>
</html>
